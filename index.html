<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    <title>🏠 家庭菜单</title>

    <!-- PWA -->
    <link rel="manifest" href="/manifest.json">
    <meta name="theme-color" content="#e74c3c">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="家庭菜单">
    <link rel="apple-touch-icon" href="/icon.svg">
    <link rel="icon" href="/icon.svg" type="image/svg+xml">
    <style>
        :root {
            --meat: #e74c3c;
            --meat-light: #fde8e5;
            --meat-bg: #fff5f5;
            --veggie: #27ae60;
            --veggie-light: #e6f7ee;
            --veggie-bg: #f5fdf8;
            --soup: #f39c12;
            --soup-light: #fef5e7;
            --soup-bg: #fffdf5;
            --staple: #e67e22;
            --staple-light: #fdf2e9;
            --staple-bg: #fffaf5;
            --bg: #f8f6f2;
            --card: #ffffff;
            --text: #2c3e50;
            --text-secondary: #7f8c8d;
            --border: #e8e4dc;
            --shadow: 0 2px 12px rgba(0,0,0,0.06);
            --radius: 16px;
            --radius-sm: 10px;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
            background: var(--bg);
            color: var(--text);
            min-height: 100vh;
            padding-bottom: 100px;
        }

        /* ===== Header ===== */
        .header {
            background: linear-gradient(135deg, #e74c3c, #f39c12);
            color: #fff;
            padding: 28px 20px 24px;
            text-align: center;
            position: sticky;
            top: 0;
            z-index: 100;
            box-shadow: 0 4px 20px rgba(231, 76, 60, 0.25);
        }
        .header h1 {
            font-size: 28px;
            font-weight: 700;
            letter-spacing: 2px;
        }
        .header .subtitle {
            font-size: 13px;
            opacity: 0.85;
            margin-top: 4px;
        }

        /* ===== Category Tabs ===== */
        .tabs {
            display: flex;
            gap: 8px;
            padding: 16px 12px 4px;
            overflow-x: auto;
            -webkit-overflow-scrolling: touch;
            scrollbar-width: none;
        }
        .tabs::-webkit-scrollbar { display: none; }
        .tab {
            flex-shrink: 0;
            padding: 10px 14px;
            border: 2px solid var(--border);
            border-radius: 50px;
            background: var(--card);
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            text-align: center;
            transition: all 0.25s;
            white-space: nowrap;
            user-select: none;
            display: flex;
            align-items: center;
            gap: 2px;
        }
        .tab:hover { border-color: #ccc; }
        .tab.active {
            color: #fff;
            border-color: transparent;
        }
        .tab.active[data-cat="all"] { background: #555; }
        .tab.active[data-cat="meat"] { background: var(--meat); }
        .tab.active[data-cat="veggie"] { background: var(--veggie); }
        .tab.active[data-cat="soup"] { background: var(--soup); }
        .tab.active[data-cat="staple"] { background: var(--staple); }
        .tab .count {
            display: inline-block;
            background: rgba(0,0,0,0.1);
            border-radius: 50px;
            padding: 2px 8px;
            font-size: 12px;
            margin-left: 4px;
        }
        .tab.active .count { background: rgba(255,255,255,0.25); }

        /* ===== Search Bar ===== */
        .search-bar {
            display: flex;
            align-items: center;
            gap: 8px;
            margin: 8px 16px;
            padding: 10px 14px;
            background: var(--card);
            border-radius: 50px;
            box-shadow: var(--shadow);
        }
        .search-icon {
            font-size: 16px;
            flex-shrink: 0;
            opacity: 0.5;
        }
        .search-bar input {
            flex: 1;
            border: none;
            outline: none;
            font-size: 15px;
            font-family: inherit;
            background: transparent;
            color: var(--text);
            min-width: 0;
        }
        .search-bar input::placeholder {
            color: #bbb;
        }
        .search-clear {
            flex-shrink: 0;
            width: 24px;
            height: 24px;
            border-radius: 50%;
            border: none;
            background: #e0e0dc;
            color: #999;
            font-size: 12px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .random-btn {
            flex-shrink: 0;
            width: 36px;
            height: 36px;
            border-radius: 50%;
            border: none;
            background: linear-gradient(135deg, #e74c3c, #f39c12);
            color: #fff;
            font-size: 18px;
            cursor: pointer;
            transition: transform 0.2s;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .random-btn:active { transform: scale(0.9); }

        /* ===== Dish List ===== */
        .list-container {
            padding: 0 16px;
        }
        .dish-list {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }
        .dish-card {
            background: var(--card);
            border-radius: var(--radius-sm);
            padding: 14px 12px;
            display: flex;
            align-items: center;
            gap: 10px;
            box-shadow: var(--shadow);
            transition: transform 0.15s, box-shadow 0.15s;
            cursor: pointer;
            border-left: 4px solid transparent;
        }
        .dish-card:hover {
            transform: translateY(-1px);
            box-shadow: 0 4px 20px rgba(0,0,0,0.1);
        }
        .dish-card.meat { border-left-color: var(--meat); }
        .dish-card.veggie { border-left-color: var(--veggie); }
        .dish-card.soup { border-left-color: var(--soup); }
        .dish-card.staple { border-left-color: var(--staple); }

        .dish-emoji {
            font-size: 28px;
            width: 40px;
            height: 40px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 10px;
            flex-shrink: 0;
        }
        .dish-card.meat .dish-emoji { background: var(--meat-light); }
        .dish-card.veggie .dish-emoji { background: var(--veggie-light); }
        .dish-card.soup .dish-emoji { background: var(--soup-light); }
        .dish-card.staple .dish-emoji { background: var(--staple-light); }

        .dish-info { flex: 1; min-width: 0; }
        .dish-name {
            font-size: 16px;
            font-weight: 600;
            line-height: 1.4;
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .dish-name-text {
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }
        .tag {
            flex-shrink: 0;
            font-size: 10px;
            font-weight: 700;
            padding: 1px 6px;
            border-radius: 4px;
            line-height: 1.5;
        }
        .tag-seafood { background: #dbeafe; color: #2563eb; }
        .tag-spicy { background: #fee2e2; color: #dc2626; }
        .tag-cold { background: #ccfbf1; color: #0d9488; }
        .dish-note {
            font-size: 12px;
            color: var(--text-secondary);
            margin-top: 2px;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .dish-want {
            flex-shrink: 0;
            display: flex;
            align-items: center;
            gap: 3px;
            padding: 5px 10px;
            border-radius: 50px;
            font-size: 13px;
            font-weight: 600;
            transition: all 0.2s;
            border: 2px solid #eee;
            background: #fafafa;
            color: #999;
            user-select: none;
        }
        .dish-want:hover { border-color: #ff6b6b; color: #ff6b6b; }
        .dish-want.wanted {
            background: #ffe0e0;
            border-color: #ff6b6b;
            color: #e74c3c;
        }
        .dish-want .want-count {
            font-size: 11px;
            background: rgba(0,0,0,0.06);
            border-radius: 50px;
            padding: 1px 5px;
            min-width: 20px;
            text-align: center;
        }
        .dish-want.wanted .want-count {
            background: rgba(231,76,60,0.15);
        }

        /* ===== Empty State ===== */
        .empty-state {
            text-align: center;
            padding: 60px 20px;
            color: var(--text-secondary);
        }
        .empty-state .empty-icon { font-size: 64px; margin-bottom: 16px; }
        .empty-state p { font-size: 15px; line-height: 1.6; }

        /* ===== FAB ===== */
        .fab {
            position: fixed;
            bottom: 84px;
            right: 24px;
            width: 56px;
            height: 56px;
            border-radius: 50%;
            background: linear-gradient(135deg, #e74c3c, #f39c12);
            color: #fff;
            border: none;
            font-size: 28px;
            cursor: pointer;
            box-shadow: 0 6px 24px rgba(231, 76, 60, 0.4);
            transition: transform 0.2s, box-shadow 0.2s;
            z-index: 200;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .fab:hover {
            transform: scale(1.08);
            box-shadow: 0 8px 30px rgba(231, 76, 60, 0.5);
        }
        .fab:active { transform: scale(0.95); }

        /* ===== Modal ===== */
        .modal-overlay {
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.4);
            z-index: 300;
            display: flex;
            align-items: flex-end;
            justify-content: center;
            animation: fadeIn 0.2s;
        }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
        @keyframes slideUp { from { transform: translateY(100%); } to { transform: translateY(0); } }

        .modal {
            background: var(--card);
            border-radius: 20px 20px 0 0;
            width: 100%;
            max-width: 500px;
            max-height: 85vh;
            overflow-y: auto;
            padding: 24px 20px 40px;
            animation: slideUp 0.3s ease-out;
        }
        .modal h2 {
            font-size: 20px;
            margin-bottom: 20px;
            text-align: center;
        }
        .form-group {
            margin-bottom: 18px;
        }
        .form-group label {
            display: block;
            font-size: 14px;
            font-weight: 600;
            margin-bottom: 6px;
            color: var(--text);
        }
        .form-group input,
        .form-group textarea,
        .form-group select {
            width: 100%;
            padding: 12px 14px;
            border: 2px solid var(--border);
            border-radius: var(--radius-sm);
            font-size: 16px;
            font-family: inherit;
            background: #fafaf8;
            transition: border-color 0.2s;
            color: var(--text);
        }
        .form-group input:focus,
        .form-group textarea:focus,
        .form-group select:focus {
            outline: none;
            border-color: #f39c12;
            background: #fff;
        }
        .form-group textarea { resize: vertical; min-height: 60px; }

        .cat-selector {
            display: flex;
            gap: 10px;
        }
        .cat-option {
            flex: 1;
            padding: 12px;
            border: 2px solid var(--border);
            border-radius: var(--radius-sm);
            text-align: center;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
            background: #fafaf8;
            user-select: none;
        }
        .cat-option:hover { border-color: #ccc; }
        .cat-option.selected[data-cat="meat"] {
            border-color: var(--meat);
            background: var(--meat-bg);
            color: var(--meat);
        }
        .cat-option.selected[data-cat="veggie"] {
            border-color: var(--veggie);
            background: var(--veggie-bg);
            color: var(--veggie);
        }
        .cat-option.selected[data-cat="soup"] {
            border-color: var(--soup);
            background: var(--soup-bg);
            color: var(--soup);
        }
        .cat-option.selected[data-cat="staple"] {
            border-color: var(--staple);
            background: var(--staple-bg);
            color: var(--staple);
        }

        .emoji-picker {
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
            margin-top: 8px;
        }
        .emoji-opt {
            width: 36px;
            height: 36px;
            border-radius: 8px;
            border: 2px solid transparent;
            background: #f5f5f0;
            font-size: 18px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.15s;
            flex-shrink: 0;
        }
        .emoji-opt:hover { border-color: #ccc; transform: scale(1.1); }
        .emoji-opt.selected { border-color: #f39c12; background: #fff8e6; }

        .btn-row {
            display: flex;
            gap: 10px;
            margin-top: 24px;
        }
        .btn {
            flex: 1;
            padding: 14px;
            border-radius: 50px;
            font-size: 16px;
            font-weight: 700;
            cursor: pointer;
            border: none;
            transition: all 0.2s;
        }
        .btn-primary {
            background: linear-gradient(135deg, #e74c3c, #f39c12);
            color: #fff;
            box-shadow: 0 4px 16px rgba(231, 76, 60, 0.3);
        }
        .btn-primary:hover { box-shadow: 0 6px 24px rgba(231, 76, 60, 0.4); transform: translateY(-1px); }
        .btn-cancel {
            background: #f0f0ec;
            color: var(--text-secondary);
        }
        .btn-cancel:hover { background: #e8e8e2; }

        /* ===== Random Pick Overlay ===== */
        .pick-overlay {
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.5);
            z-index: 999;
            display: flex;
            align-items: center;
            justify-content: center;
            animation: fadeIn 0.2s;
        }
        .pick-card {
            background: #fff;
            border-radius: 24px;
            padding: 32px 28px 24px;
            text-align: center;
            max-width: 300px;
            width: 85%;
            animation: popIn 0.35s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            position: relative;
        }
        .pick-close {
            position: absolute;
            top: 12px;
            right: 14px;
            width: 28px;
            height: 28px;
            border-radius: 50%;
            border: none;
            background: #f0f0ec;
            color: #999;
            font-size: 14px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        @keyframes popIn {
            from { transform: scale(0.5); opacity: 0; }
            to { transform: scale(1); opacity: 1; }
        }
        .pick-title {
            font-size: 18px;
            font-weight: 700;
            color: #e74c3c;
            margin-bottom: 16px;
        }
        .pick-emoji {
            font-size: 64px;
            margin-bottom: 12px;
            animation: bounce 0.6s ease-in-out 0.2s both;
        }
        @keyframes bounce {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-16px); }
        }
        .pick-name {
            font-size: 22px;
            font-weight: 700;
            color: #2c3e50;
            margin-bottom: 6px;
        }
        .pick-cat {
            font-size: 14px;
            color: #999;
            margin-bottom: 20px;
        }
        .pick-actions {
            display: flex;
            gap: 8px;
            justify-content: center;
        }
        .pick-btn {
            border: none;
            border-radius: 50px;
            padding: 10px 16px;
            font-size: 14px;
            font-weight: 700;
            cursor: pointer;
            white-space: nowrap;
        }
        .pick-add {
            background: linear-gradient(135deg, #e74c3c, #f39c12);
            color: #fff;
        }
        .pick-again {
            background: #f0f0ec;
            color: #666;
        }

        /* ===== Toast ===== */
        .toast {
            position: fixed;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            background: #2c3e50;
            color: #fff;
            padding: 12px 24px;
            border-radius: 50px;
            font-size: 14px;
            font-weight: 600;
            z-index: 999;
            animation: toastIn 0.3s, toastOut 0.3s 1.7s forwards;
            pointer-events: none;
        }
        @keyframes toastIn { from { opacity: 0; transform: translateX(-50%) translateY(-20px); } to { opacity: 1; transform: translateX(-50%) translateY(0); } }
        @keyframes toastOut { from { opacity: 1; } to { opacity: 0; } }

        /* ===== Page System ===== */
        .page { display: none; }
        .page.active { display: block; }

        /* ===== Bottom Nav ===== */
        .bottom-nav {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            background: var(--card);
            display: flex;
            border-top: 1px solid var(--border);
            z-index: 200;
            padding-bottom: env(safe-area-inset-bottom);
            box-shadow: 0 -2px 12px rgba(0,0,0,0.05);
        }
        .nav-item {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 8px 0 6px;
            cursor: pointer;
            transition: color 0.2s;
            color: #aaa;
            position: relative;
        }
        .nav-item.active { color: #e74c3c; }
        .nav-icon { font-size: 22px; }
        .nav-label { font-size: 11px; font-weight: 600; margin-top: 2px; }
        .nav-badge {
            position: absolute;
            top: 4px;
            right: 50%;
            transform: translateX(140%);
            background: #e74c3c;
            color: #fff;
            font-size: 10px;
            font-weight: 700;
            min-width: 18px;
            height: 18px;
            border-radius: 9px;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 0 5px;
        }

        /* ===== Today Page ===== */
        .today-list {
            padding: 0 16px 100px;
        }
        .today-group {
            margin-bottom: 20px;
        }
        .today-group-title {
            font-size: 14px;
            font-weight: 700;
            color: var(--text-secondary);
            padding: 12px 4px 8px;
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .today-dish {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 12px 14px;
            background: var(--card);
            border-radius: var(--radius-sm);
            margin-bottom: 8px;
            box-shadow: var(--shadow);
        }
        .today-dish .td-emoji { font-size: 28px; flex-shrink: 0; }
        .today-dish .td-name { flex: 1; font-size: 16px; font-weight: 600; }
        .today-dish .td-remove {
            width: 28px; height: 28px;
            border-radius: 50%;
            border: none;
            background: #fee;
            color: #e74c3c;
            font-size: 14px;
            cursor: pointer;
            flex-shrink: 0;
        }
        .today-empty { padding-top: 80px; }
        .today-clear {
            display: block;
            margin: 20px auto 0;
            padding: 8px 20px;
            border-radius: 50px;
            border: 1px solid #ddd;
            background: #fff;
            color: #999;
            font-size: 13px;
            cursor: pointer;
        }

        /* ===== Responsive ===== */
        @media (max-width: 400px) {
            .header { padding: 20px 16px 18px; }
            .header h1 { font-size: 22px; }
            .header .subtitle { font-size: 12px; }
            .search-bar { margin: 8px 10px; padding: 8px 12px; }
            .search-bar input { font-size: 14px; }
            .list-container { padding: 0 10px; }
            .dish-card { padding: 12px 10px; gap: 8px; }
            .dish-emoji { font-size: 24px; width: 36px; height: 36px; }
            .dish-name { font-size: 15px; }
            .dish-want { padding: 4px 8px; font-size: 12px; }
            .fab { width: 48px; height: 48px; font-size: 24px; bottom: 80px; right: 20px; }
            .today-list { padding: 0 10px 100px; }
        }
    </style>
</head>
<body>

    <!-- ==================== 菜单浏览页 ==================== -->
    <div id="page-browse" class="page active">

    <!-- Header -->
    <div class="header">
        <h1>🏠 家庭菜单</h1>
        <div class="subtitle" id="headerSubtitle">今天想吃什么？</div>
    </div>

    <!-- Tabs -->
    <div class="tabs">
        <div class="tab active" data-cat="all" onclick="switchTab('all')">
            全部 <span class="count" id="countAll">0</span>
        </div>
        <div class="tab" data-cat="meat" onclick="switchTab('meat')">
            🥩 荤菜 <span class="count" id="countMeat">0</span>
        </div>
        <div class="tab" data-cat="veggie" onclick="switchTab('veggie')">
            🥬 素菜 <span class="count" id="countVeggie">0</span>
        </div>
        <div class="tab" data-cat="soup" onclick="switchTab('soup')">
            🍲 汤 <span class="count" id="countSoup">0</span>
        </div>
        <div class="tab" data-cat="staple" onclick="switchTab('staple')">
            🍚 主食 <span class="count" id="countStaple">0</span>
        </div>
    </div>

    <!-- Search -->
    <div class="search-bar" id="searchBar">
        <span class="search-icon">🔍</span>
        <input type="text" id="searchInput" placeholder="搜索菜品..." autocomplete="off" oninput="onSearch()">
        <button class="search-clear" id="searchClear" onclick="clearSearch()" style="display:none">✕</button>
        <button class="random-btn" onclick="randomPick()" title="随机选一道">🎲</button>
        <button class="random-btn" id="syncBtn" onclick="forceSync()" title="同步最新菜库" style="margin-left:4px;font-size:14px">🔄</button>
    </div>

    <!-- Dish List -->
    <div class="list-container">
        <div class="dish-list" id="dishList"></div>
        <div class="empty-state" id="emptyState">
            <div class="empty-icon">📋</div>
            <p>菜单还是空的呢～<br>点击右下角 <b>+</b> 来添加第一道菜吧！</p>
        </div>
    </div>

    <!-- FAB -->
    <button class="fab" onclick="openModal()" title="添加菜品">+</button>

    </div><!-- /page-browse -->

        // 版本检测：新版本清除菜品缓存强制重新同步（不碰Token和今日菜单）
        (function checkVersion() {
            const stored = localStorage.getItem(VERSION_KEY);
            if (stored !== APP_VERSION) {
                // 只清除菜品相关数据，保留 Token、今日菜单
                localStorage.removeItem(STORE_KEY);
                localStorage.removeItem(WANT_KEY);
                localStorage.setItem(VERSION_KEY, APP_VERSION);

        })();

        // 任何设备加菜/删菜 → 推送操作到 today.json；其他设备轮询拉取最新内容
        let todayEtag = '';       // 轮询用 ETag（304 不计入 API 限流）
        let todayPushCount = 0;   // 进行中的推送数（推送期间暂停应用远端数据，防止本地修改被回滚）

        function todayDateStr() {
            const n = new Date();
            return n.getFullYear() + '-' + (n.getMonth() + 1) + '-' + n.getDate();
        }

        function todayApiHeaders() {
            return {
                Authorization: 'Bearer ' + ghToken,
                Accept: 'application/vnd.github+json',
                'X-GitHub-Api-Version': '2022-11-28'
            };
        }

        // 拉取远端今日菜单；返回 null 表示无变化或失败。日期不是今天则视为空
        async function fetchTodayRemote() {
            const today = todayDateStr();
            try {
                if (ghToken) {
                    const headers = todayApiHeaders();
                    if (todayEtag) headers['If-None-Match'] = todayEtag;
                    const res = await fetch(`https://api.github.com/repos/${GH_REPO}/contents/today.json`, { headers });
                    if (res.status === 304) return null;
                    if (!res.ok) return null;
                    const etag = res.headers.get('ETag');
                    if (etag) todayEtag = etag;
                    const file = await res.json();
                    const data = JSON.parse(base64Decode(file.content));
                    return { dishes: data.date === today ? (data.dishes || []) : [] };
                }
                // 无 Token：走 raw（CDN 有缓存，延迟几分钟，尽力而为）
                const res = await fetch('https://raw.githubusercontent.com/' + GH_REPO + '/master/today.json?t=' + Date.now(), { cache: 'no-cache' });
                if (!res.ok) return null;
                const data = await res.json();
                return { dishes: data.date === today ? (data.dishes || []) : [] };
            } catch { return null; }
        }

        // 应用远端数据到本地（推送进行中跳过，避免覆盖刚做的修改）
        function applyTodayRemote(remote, silent) {
            if (!remote || todayPushCount > 0) return;
            if (JSON.stringify(remote.dishes) === JSON.stringify(todayMenu)) return;
            todayMenu = remote.dishes;
            saveToday();
            renderList();
            renderTodayIfActive();
            if (!silent) showToast('🔄 今日菜单已同步更新');
        }

        // 推送一个操作到云端：add / remove / clear。冲突(409)时基于最新服务端状态重放操作，最多3次
        async function pushTodayOp(op) {
            if (!ghToken) return;
            todayPushCount++;
            try {
                const url = `https://api.github.com/repos/${GH_REPO}/contents/today.json`;
                for (let attempt = 0; attempt < 3; attempt++) {
                    const res = await fetch(url, { headers: todayApiHeaders() });
                    if (!res.ok) return;
                    const file = await res.json();
                    const data = JSON.parse(base64Decode(file.content));
                    let list = data.date === todayDateStr() ? (data.dishes || []) : [];
                    if (op.type === 'add') {
                        if (!list.includes(op.id)) list.push(op.id);
                    } else if (op.type === 'remove') {
                        list = list.filter(id => id !== op.id);
                    } else if (op.type === 'clear') {
                        list = [];
                    }
                    const newContent = JSON.stringify({ date: todayDateStr(), dishes: list }) + '\n';
                    const putRes = await fetch(url, {
                        method: 'PUT',
                        headers: { ...todayApiHeaders(), 'Content-Type': 'application/json' },
                        body: JSON.stringify({
                            message: '今日菜单：' + (op.type === 'add' ? '加菜' : op.type === 'remove' ? '删菜' : '清空'),
                            content: base64Encode(newContent),
                            sha: file.sha
                        })
                    });
                    if (putRes.ok) {
                        todayEtag = ''; // 内容已变，强制下次轮询拉全量
                        return;
                    }
                    if (putRes.status !== 409) return; // 非冲突错误不重试
                }
            } catch { /* 静默，下次操作或轮询会再同步 */ }
            finally { todayPushCount--; }
        }

        // 轮询：有 Token 10 秒一次（ETag 304 不计限流），无 Token 30 秒走 raw
        let todayPollTimer = null;
        function startTodayPolling() {
            if (todayPollTimer) clearInterval(todayPollTimer);
            todayPollTimer = setInterval(async () => {
                if (document.hidden) return;
                applyTodayRemote(await fetchTodayRemote());
            }, ghToken ? 10000 : 30000);
        }
        // 切回前台立即拉一次
        document.addEventListener('visibilitychange', async () => {
            if (!document.hidden) applyTodayRemote(await fetchTodayRemote());
        });

        // ===== Sync: 从 data.json 拉取菜库，确保本地有全部服务器菜品 =====
        async function syncFromServer(showMsg) {
            try {
                let res = await fetch('https://raw.githubusercontent.com/' + GH_REPO + '/master/data.json?t=' + Date.now(), { cache: 'no-cache' });
                if (!res.ok) {
                    res = await fetch('/data.json?t=' + Date.now(), { cache: 'no-cache' });
                }
                if (!res.ok) return;
                const serverDishes = await res.json();
                if (!Array.isArray(serverDishes) || serverDishes.length === 0) return;

                let changed = false;
                let newCount = 0;

                serverDishes.forEach(sd => {
                    let existing = dishes.find(d => d.id === sd.id);
                    if (!existing) {
                        // 检查是否有同名本地菜品（用户刚同步的），若有则合并而非重复
                        existing = dishes.find(d => d.name === sd.name && d.fromServer === false && !d.id.startsWith('d'));
                        if (existing) {
                            existing.id = sd.id;
                            existing.fromServer = true;
                            changed = true;
                        }
                    }
                    if (existing && existing.id === sd.id) {
                        if (sd.cat && existing.cat !== sd.cat) { existing.cat = sd.cat; changed = true; }
                        if (sd.name && existing.name !== sd.name) { existing.name = sd.name; changed = true; }
                        if (sd.emoji !== undefined && existing.emoji !== sd.emoji) { existing.emoji = sd.emoji; changed = true; }
                        if (sd.note !== undefined && existing.note !== sd.note) { existing.note = sd.note; changed = true; }
                        if (sd.tags !== undefined) { existing.tags = sd.tags; changed = true; }
                    } else {
                        dishes.push({
                            id: sd.id, name: sd.name, cat: sd.cat,
                            emoji: sd.emoji || '', note: sd.note || '',
                            tags: sd.tags || [],
                            fromServer: true,
                            createdAt: sd.createdAt || (new Date('2026-06-01').getTime() + parseInt(sd.id.replace('d','')) * 60000),
                        });
                        changed = true;
                        newCount++;
                    }
                });

                // 去重：同名同ID只保留一份
                const seen = new Set();
                dishes = dishes.filter(d => {
                    const key = d.id;
                    if (seen.has(key)) return false;
                    seen.add(key);
                    return true;
                });

                if (changed) {
                    saveStore();
                    renderAll();
                    if (showMsg !== false) {
                        showToast(newCount > 0 ? '🆕 发现 ' + newCount + ' 道新菜！' : '🔄 菜单已同步');
                    }
                } else if (showMsg) {
                    showToast('✅ 已是最新');
                }
            } catch (e) {
                console.log('📡 离线模式，使用本地数据');
                if (showMsg) showToast('📡 网络不可用');
            }
        }

        async function initData() {
            ensureSeedData();           // 内嵌种子数据，保证一定有菜
            loadStore();                 // 加载本地（含种子数据 + 用户自增）
            // 去重：同ID只保留一份，同ID优先保留 fromServer 的
            const deduped = [];
            const seen = new Set();
            dishes.forEach(d => {
                if (seen.has(d.id)) return;
                seen.add(d.id);
                deduped.push(d);
            });
            dishes = deduped;
            saveStore();
            await syncFromServer();      // 拉取服务器新增菜品
            applyTodayRemote(await fetchTodayRemote(), true);  // 拉取云端今日菜单（静默）

        // ===== Render =====
        function getFilteredDishes() {
            let result = currentTab === 'all' ? [...dishes] : dishes.filter(d => d.cat === currentTab);
            if (searchQuery) {
                const q = searchQuery.toLowerCase();
                result = result.filter(d => d.name.toLowerCase().includes(q));
            }
            // 排序规则：按ID降序。d开头取数字，u开头取时间戳
            result.sort((a, b) => {
                const getVal = (id) => {
                    if (id.startsWith('d')) return parseInt(id.slice(1));
                    if (id.startsWith('u')) return parseInt(id.slice(1).split('_')[0]) / 1000;
                    return 0;
                };
                return getVal(b.id) - getVal(a.id);
            });
            return result;
        }

            todayMenu = todayMenu.filter(tid => tid !== id);
            saveStore();

        async function syncDeleteFromGitHub(id, name) {
            try {
                const apiHeaders = {
                    Authorization: 'Bearer ' + ghToken,
                    Accept: 'application/vnd.github+json',
                    'X-GitHub-Api-Version': '2022-11-28'
                };
                const url = `https://api.github.com/repos/${GH_REPO}/contents/data.json`;
                const res = await fetch(url, { headers: apiHeaders });
                if (!res.ok) return;
                const file = await res.json();
                const content = JSON.parse(base64Decode(file.content));
                const idx = content.findIndex(d => d.id === id);
                if (idx < 0) return;
                content.splice(idx, 1);
                const newContent = JSON.stringify(content, null, 2) + '\n';
                await fetch(url, {
                    method: 'PUT',
                    headers: { ...apiHeaders, 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        message: `删除菜品：${name}`,
                        content: base64Encode(newContent),
                        sha: file.sha
                    })
                });
            } catch (e) { /* 静默 */ }
        }

        // ===== 自动打标签：根据菜名关键词匹配 =====
        function autoTag(name) {

                tags.push('海鲜');

            // 辣
            if (/辣|麻辣|香辣|辣椒|剁椒|泡椒|红油|水煮|酸辣/i.test(name)) {
                tags.push('辣');
            }
            // 凉菜
            if (/凉拌|拌|沙拉|老虎菜|蒜泥|卤|酱香肘|皮冻/i.test(name)) {
                tags.push('凉菜');
            }
            return tags;
        }

        function saveDish() {
            const name = document.getElementById('dishName').value.trim();
            if (!name) { showToast('请输入菜品名称'); document.getElementById('dishName').focus(); return; }
            const note = document.getElementById('dishNote').value.trim();

            // 重名检测
            const dup = dishes.find(d => d.name === name && d.id !== editingId);
            if (dup) {
                showToast('「' + name + '」已存在，无需重复添加');
                return;
            }

            if (editingId) {
                const dish = dishes.find(d => d.id === editingId);
                if (dish) {
                    dish.name = name;
                    dish.cat = selectedCat;
                    dish.emoji = selectedEmoji;
                    dish.note = note;
                    dish.tags = autoTag(name);
                }
            } else {
                dishes.push({
                    id: 'u' + Date.now() + '_' + Math.random().toString(36).slice(2, 6),
                    name,
                    cat: selectedCat,
                    emoji: selectedEmoji,
                    note,
                    tags: autoTag(name),
                    fromServer: false,
                    createdAt: Date.now(),
                });
            }

            saveStore();
            closeModal();
            renderAll();

            // 自动同步到 GitHub
            if (!editingId && ghToken) {
                syncNewDishToGitHub(name, selectedCat, selectedEmoji, note);
            } else if (!editingId && !ghToken) {
                showToast('已添加 🎉（仅本机）');
            } else if (editingId && ghToken) {
                syncEditToGitHub(editingId);
            } else {
                showToast(editingId ? '已更新 ✨' : '已添加 🎉');
            }
        }

        // ===== GitHub 自动同步 =====
        function base64Encode(str) {
            const bytes = new TextEncoder().encode(str);
            const binString = Array.from(bytes, b => String.fromCharCode(b)).join('');
            return btoa(binString);
        }
        function base64Decode(b64) {
            const binString = atob(b64);
            const bytes = Uint8Array.from(binString, c => c.charCodeAt(0));
            return new TextDecoder().decode(bytes);
        }

        async function syncNewDishToGitHub(name, cat, emoji, note) {
            showToast('☁️ 正在同步到服务器...');
            try {
                const apiHeaders = {
                    Authorization: 'Bearer ' + ghToken,
                    Accept: 'application/vnd.github+json',
                    'X-GitHub-Api-Version': '2022-11-28'
                };

                // 1. 拉取当前 data.json
                const url = `https://api.github.com/repos/${GH_REPO}/contents/data.json`;
                const res = await fetch(url, { headers: apiHeaders });
                if (!res.ok) {
                    const err = await res.json().catch(() => ({}));
                    throw new Error(err.message || 'HTTP ' + res.status);
                }
                const file = await res.json();
                const content = JSON.parse(base64Decode(file.content));
                const sha = file.sha;

                // 2. 生成新 ID
                const maxId = content.reduce((max, d) => {
                    const n = parseInt(d.id.replace('d', ''));
                    return n > max ? n : max;
                }, 0);
                const newId = 'd' + String(maxId + 1).padStart(3, '0');

                // 3. 追加新菜品
                const newDish = {
                    id: newId, name, cat, emoji: emoji || '', note: note || '',
                    tags: autoTag(name)
                };
                content.push(newDish);

                // 4. 提交到 GitHub
                const newContent = JSON.stringify(content, null, 2) + '\n';
                const putRes = await fetch(url, {
                    method: 'PUT',
                    headers: { ...apiHeaders, 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        message: `新增菜品：${name}`,
                        content: base64Encode(newContent),
                        sha: sha
                    })
                });
                if (!putRes.ok) {
                    const err = await putRes.json().catch(() => ({}));
                    throw new Error(err.message || 'HTTP ' + putRes.status);
                }

                // 5. 更新本地：ID 改为服务端 ID，标记已同步
                const localDish = dishes.find(d => d.name === name && d.fromServer === false && !d.id.startsWith('d'));
                if (localDish) {
                    localDish.id = newId;
                    localDish.fromServer = true;
                    saveStore();
                    renderAll();
                }
                showToast('✅ 已同步上线，家人可见！');
            } catch (e) {
                console.error('同步失败:', e);
                showToast('⚠️ ' + (e.message || '同步失败，仅保存在本机'));
            }
        }

        async function syncEditToGitHub(editId) {
            const dish = dishes.find(d => d.id === editId);
            if (!dish) return;
            showToast('☁️ 正在同步到服务器...');
            try {
                const apiHeaders = {
                    Authorization: 'Bearer ' + ghToken,
                    Accept: 'application/vnd.github+json',
                    'X-GitHub-Api-Version': '2022-11-28'
                };

                const url = `https://api.github.com/repos/${GH_REPO}/contents/data.json`;
                const res = await fetch(url, { headers: apiHeaders });
                if (!res.ok) {
                    const err = await res.json().catch(() => ({}));
                    throw new Error(err.message || 'HTTP ' + res.status);
                }
                const file = await res.json();
                const content = JSON.parse(base64Decode(file.content));
                const sha = file.sha;

                // 更新对应菜品
                const idx = content.findIndex(d => d.id === editId);
                if (idx >= 0) {
                    content[idx].name = dish.name;
                    content[idx].cat = dish.cat;
                    content[idx].emoji = dish.emoji;
                    content[idx].note = dish.note || '';
                    content[idx].tags = dish.tags || [];
                } else {
                    content.push({
                        id: editId, name: dish.name, cat: dish.cat,
                        emoji: dish.emoji || '', note: dish.note || '', tags: dish.tags || []
                    });
                }

                const newContent = JSON.stringify(content, null, 2) + '\n';
                const putRes = await fetch(url, {
                    method: 'PUT',
                    headers: { ...apiHeaders, 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        message: `编辑菜品：${dish.name}`,
                        content: base64Encode(newContent),
                        sha: sha
                    })
                });
                if (!putRes.ok) {
                    const err = await putRes.json().catch(() => ({}));
                    throw new Error(err.message || 'HTTP ' + putRes.status);
                }

                if (!dish.fromServer) {
                    dish.fromServer = true;
                    saveStore();
                    renderAll();
                }
                showToast('✅ 已同步上线！');
            } catch (e) {
                console.error('同步失败:', e);
                showToast('⚠️ ' + (e.message || '同步失败，仅保存在本机'));
            }
        }

        // ===== 管理员设置 Token（长按标题 3 秒） =====
        async function setToken(token) {
            if (!token) {
                localStorage.removeItem(GH_TOKEN_KEY);
                ghToken = '';
                showToast('🔒 自动同步已关闭');
                startTodayPolling();  // 降级为 30 秒慢轮询
                return;
            }
            // 验证 Token 是否有效
            showToast('🔍 正在验证 Token...');
            try {
                const testRes = await fetch(`https://api.github.com/repos/${GH_REPO}`, {
                    headers: {
                        Authorization: 'Bearer ' + token,
                        Accept: 'application/vnd.github+json',
                        'X-GitHub-Api-Version': '2022-11-28'
                    }
                });
                if (!testRes.ok) {
                    const msg = testRes.status === 401 ? 'Token 无效或已过期' :
                                testRes.status === 403 ? 'Token 没有访问此仓库的权限' :
                                testRes.status === 404 ? '仓库不存在或 Token 未授权此仓库' :
                                '验证失败 HTTP ' + testRes.status;
                    showToast('❌ ' + msg);
                    return;
                }
                localStorage.setItem(GH_TOKEN_KEY, token);
                ghToken = token;
                showToast('✅ Token 有效，自动同步已开启');
                updateSyncStatus();
                applyTodayRemote(await fetchTodayRemote(), true);  // 立即拉一次今日菜单
                startTodayPolling();  // 切换为 10 秒快轮询
            } catch (e) {
                showToast('❌ 网络错误，请稍后重试');
            }
        }

        let headerTapTimer = null;
        function promptToken() {
            const token = prompt('🔑 输入 GitHub Personal Access Token\n（Fine-grained token → 选 j-kai-moji/menu → Contents 读写权限）\n\n留空则关闭自动同步', ghToken);
            if (token !== null) setToken(token.trim());
        }
        document.querySelector('.header').addEventListener('mousedown', () => {
            headerTapTimer = setTimeout(promptToken, 3000);
        });
        document.querySelector('.header').addEventListener('mouseup', () => clearTimeout(headerTapTimer));
        document.querySelector('.header').addEventListener('mouseleave', () => clearTimeout(headerTapTimer));
        document.querySelector('.header').addEventListener('touchstart', () => {
            headerTapTimer = setTimeout(promptToken, 3000);
        }, { passive: true });
        document.querySelector('.header').addEventListener('touchend', () => clearTimeout(headerTapTimer));
        document.querySelector('.header').addEventListener('touchcancel', () => clearTimeout(headerTapTimer));

        // ===== Toast =====
        function showToast(msg) {
            const container = document.getElementById('toastContainer');
            const toast = document.createElement('div');
            toast.className = 'toast';
            toast.textContent = msg;
            container.appendChild(toast);
            setTimeout(() => toast.remove(), 3000);
        }

        // ===== Keyboard =====
        document.addEventListener('keydown', e => {
            if (e.key === 'Escape') closeModal();
            if (e.key === 'Enter' && document.getElementById('modalOverlay').style.display === 'flex') {
                saveDish();
            }
        });

        // ===== PWA: Service Worker =====
        if ('serviceWorker' in navigator) {
            // 彻底清理所有旧 SW
            navigator.serviceWorker.getRegistrations().then(regs => {
                regs.forEach(r => r.unregister());
                // 清除所有 SW 缓存
                caches.keys().then(keys => {
                    keys.forEach(k => caches.delete(k));
                });
            }).finally(() => {
                navigator.serviceWorker.register('/sw.js?v=' + APP_VERSION).catch(() => {});
            });
        }

        // ===== 长按删除菜品 =====
        (function initLongPress() {
            const list = document.getElementById('dishList');
            let timer = null, targetCard = null;
            list.addEventListener('touchstart', (e) => {
                targetCard = e.target.closest('.dish-card');
                if (!targetCard) return;
                timer = setTimeout(() => {
                    const id = targetCard.dataset.id;
                    if (id) deleteDish(id);
                    timer = null;
                }, 800);
            }, { passive: true });
            list.addEventListener('touchend', () => { clearTimeout(timer); });
            list.addEventListener('touchmove', () => { clearTimeout(timer); });
            list.addEventListener('mousedown', (e) => {
                targetCard = e.target.closest('.dish-card');
                if (!targetCard) return;
                timer = setTimeout(() => {
                    const id = targetCard.dataset.id;
                    if (id) deleteDish(id);
                    timer = null;
                }, 800);
            });
            list.addEventListener('mouseup', () => { clearTimeout(timer); });
            list.addEventListener('mouseleave', () => { clearTimeout(timer); });
        })();

        // ===== Init =====
        initData().then(() => {
            console.log('✅ 菜单加载完成，共 ' + dishes.length + ' 道菜');
            updateSyncStatus();
        });
        renderEmojiPicker();

        function updateSyncStatus() {
            const sub = document.getElementById('headerSubtitle');
            const localCount = dishes.filter(d => !d.fromServer).length;
            if (!ghToken) {
                sub.textContent = localCount > 0 ? `今天想吃什么？（${localCount}道本地菜未同步）` : '今天想吃什么？';
                sub.style.color = localCount > 0 ? '#ffe0a0' : '';
            } else {
                sub.textContent = localCount > 0 ? `☁️ ${localCount}道待同步，编辑后自动推送` : '☁️ 自动同步已开启';
                sub.style.color = '';
            }
        }
    </script>
</body>
</html>
