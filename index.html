<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>🏠 家庭菜单</title>

    <!-- PWA -->
    <link rel="manifest" href="/manifest.json">
    <meta name="theme-color" content="#e74c3c">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="家庭菜单">
    <link rel="apple-touch-icon" href="/icon.svg">
    <link rel="icon" href="/icon.svg" type="image/svg+xml">
    <style>
        :root {
            --meat: #e74c3c;
            --meat-light: #fde8e5;
            --meat-bg: #fff5f5;
            --veggie: #27ae60;
            --veggie-light: #e6f7ee;
            --veggie-bg: #f5fdf8;
            --soup: #f39c12;
            --soup-light: #fef5e7;
            --soup-bg: #fffdf5;
            --staple: #e67e22;
            --staple-light: #fdf2e9;
            --staple-bg: #fffaf5;
            --bg: #f8f6f2;
            --card: #ffffff;
            --text: #2c3e50;
            --text-secondary: #7f8c8d;
            --border: #e8e4dc;
            --shadow: 0 2px 12px rgba(0,0,0,0.06);
            --radius: 16px;
            --radius-sm: 10px;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
            background: var(--bg);
            color: var(--text);
            min-height: 100vh;
            padding-bottom: 100px;
        }

        /* ===== Header ===== */
        .header {
            background: linear-gradient(135deg, #e74c3c, #f39c12);
            color: #fff;
            padding: 28px 20px 24px;
            text-align: center;
            position: sticky;
            top: 0;
            z-index: 100;
            box-shadow: 0 4px 20px rgba(231, 76, 60, 0.25);
        }
        .header h1 {
            font-size: 28px;
            font-weight: 700;
            letter-spacing: 2px;
        }
        .header .subtitle {
            font-size: 13px;
            opacity: 0.85;
            margin-top: 4px;
        }

        /* ===== Category Tabs ===== */
        .tabs {
            display: flex;
            gap: 8px;
            padding: 16px 12px 4px;
            overflow-x: auto;
            -webkit-overflow-scrolling: touch;
            scrollbar-width: none;
        }
        .tabs::-webkit-scrollbar { display: none; }
        .tab {
            flex-shrink: 0;
            padding: 10px 14px;
            border: 2px solid var(--border);
            border-radius: 50px;
            background: var(--card);
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            text-align: center;
            transition: all 0.25s;
            white-space: nowrap;
            user-select: none;
            display: flex;
            align-items: center;
            gap: 2px;
        }
        .tab:hover { border-color: #ccc; }
        .tab.active {
            color: #fff;
            border-color: transparent;
        }
        .tab.active[data-cat="all"] { background: #555; }
        .tab.active[data-cat="meat"] { background: var(--meat); }
        .tab.active[data-cat="veggie"] { background: var(--veggie); }
        .tab.active[data-cat="soup"] { background: var(--soup); }
        .tab.active[data-cat="staple"] { background: var(--staple); }
        .tab .count {
            display: inline-block;
            background: rgba(0,0,0,0.1);
            border-radius: 50px;
            padding: 2px 8px;
            font-size: 12px;
            margin-left: 4px;
        }
        .tab.active .count { background: rgba(255,255,255,0.25); }

        /* ===== Search Bar ===== */
        .search-bar {
            display: flex;
            align-items: center;
            gap: 8px;
            margin: 8px 16px;
            padding: 10px 14px;
            background: var(--card);
            border-radius: 50px;
            box-shadow: var(--shadow);
        }
        .search-icon {
            font-size: 16px;
            flex-shrink: 0;
            opacity: 0.5;
        }
        .search-bar input {
            flex: 1;
            border: none;
            outline: none;
            font-size: 15px;
            font-family: inherit;
            background: transparent;
            color: var(--text);
            min-width: 0;
        }
        .search-bar input::placeholder {
            color: #bbb;
        }
        .search-clear {
            flex-shrink: 0;
            width: 24px;
            height: 24px;
            border-radius: 50%;
            border: none;
            background: #e0e0dc;
            color: #999;
            font-size: 12px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .random-btn {
            flex-shrink: 0;
            width: 36px;
            height: 36px;
            border-radius: 50%;
            border: none;
            background: linear-gradient(135deg, #e74c3c, #f39c12);
            color: #fff;
            font-size: 18px;
            cursor: pointer;
            transition: transform 0.2s;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .random-btn:active { transform: scale(0.9); }

        /* ===== Dish List ===== */
        .list-container {
            padding: 0 16px;
        }
        .dish-list {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }
        .dish-card {
            background: var(--card);
            border-radius: var(--radius-sm);
            padding: 14px 12px;
            display: flex;
            align-items: center;
            gap: 10px;
            box-shadow: var(--shadow);
            transition: transform 0.15s, box-shadow 0.15s;
            cursor: pointer;
            border-left: 4px solid transparent;
        }
        .dish-card:hover {
            transform: translateY(-1px);
            box-shadow: 0 4px 20px rgba(0,0,0,0.1);
        }
        .dish-card.meat { border-left-color: var(--meat); }
        .dish-card.veggie { border-left-color: var(--veggie); }
        .dish-card.soup { border-left-color: var(--soup); }
        .dish-card.staple { border-left-color: var(--staple); }

        .dish-emoji {
            font-size: 28px;
            width: 40px;
            height: 40px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 10px;
            flex-shrink: 0;
        }
        .dish-card.meat .dish-emoji { background: var(--meat-light); }
        .dish-card.veggie .dish-emoji { background: var(--veggie-light); }
        .dish-card.soup .dish-emoji { background: var(--soup-light); }
        .dish-card.staple .dish-emoji { background: var(--staple-light); }

        .dish-info { flex: 1; min-width: 0; }
        .dish-name {
            font-size: 16px;
            font-weight: 600;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
            line-height: 1.3;
        }
        .dish-note {
            font-size: 12px;
            color: var(--text-secondary);
            margin-top: 2px;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .dish-want {
            flex-shrink: 0;
            display: flex;
            align-items: center;
            gap: 3px;
            padding: 5px 10px;
            border-radius: 50px;
            font-size: 13px;
            font-weight: 600;
            transition: all 0.2s;
            border: 2px solid #eee;
            background: #fafafa;
            color: #999;
            user-select: none;
        }
        .dish-want:hover { border-color: #ff6b6b; color: #ff6b6b; }
        .dish-want.wanted {
            background: #ffe0e0;
            border-color: #ff6b6b;
            color: #e74c3c;
        }
        .dish-want .want-count {
            font-size: 11px;
            background: rgba(0,0,0,0.06);
            border-radius: 50px;
            padding: 1px 5px;
            min-width: 20px;
            text-align: center;
        }
        .dish-want.wanted .want-count {
            background: rgba(231,76,60,0.15);
        }

        /* ===== Empty State ===== */
        .empty-state {
            text-align: center;
            padding: 60px 20px;
            color: var(--text-secondary);
        }
        .empty-state .empty-icon { font-size: 64px; margin-bottom: 16px; }
        .empty-state p { font-size: 15px; line-height: 1.6; }

        /* ===== FAB ===== */
        .fab {
            position: fixed;
            bottom: 84px;
            right: 24px;
            width: 56px;
            height: 56px;
            border-radius: 50%;
            background: linear-gradient(135deg, #e74c3c, #f39c12);
            color: #fff;
            border: none;
            font-size: 28px;
            cursor: pointer;
            box-shadow: 0 6px 24px rgba(231, 76, 60, 0.4);
            transition: transform 0.2s, box-shadow 0.2s;
            z-index: 200;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .fab:hover {
            transform: scale(1.08);
            box-shadow: 0 8px 30px rgba(231, 76, 60, 0.5);
        }
        .fab:active { transform: scale(0.95); }

        /* ===== Modal ===== */
        .modal-overlay {
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.4);
            z-index: 300;
            display: flex;
            align-items: flex-end;
            justify-content: center;
            animation: fadeIn 0.2s;
        }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
        @keyframes slideUp { from { transform: translateY(100%); } to { transform: translateY(0); } }

        .modal {
            background: var(--card);
            border-radius: 20px 20px 0 0;
            width: 100%;
            max-width: 500px;
            max-height: 85vh;
            overflow-y: auto;
            padding: 24px 20px 40px;
            animation: slideUp 0.3s ease-out;
        }
        .modal h2 {
            font-size: 20px;
            margin-bottom: 20px;
            text-align: center;
        }
        .form-group {
            margin-bottom: 18px;
        }
        .form-group label {
            display: block;
            font-size: 14px;
            font-weight: 600;
            margin-bottom: 6px;
            color: var(--text);
        }
        .form-group input,
        .form-group textarea,
        .form-group select {
            width: 100%;
            padding: 12px 14px;
            border: 2px solid var(--border);
            border-radius: var(--radius-sm);
            font-size: 16px;
            font-family: inherit;
            background: #fafaf8;
            transition: border-color 0.2s;
            color: var(--text);
        }
        .form-group input:focus,
        .form-group textarea:focus,
        .form-group select:focus {
            outline: none;
            border-color: #f39c12;
            background: #fff;
        }
        .form-group textarea { resize: vertical; min-height: 60px; }

        .cat-selector {
            display: flex;
            gap: 10px;
        }
        .cat-option {
            flex: 1;
            padding: 12px;
            border: 2px solid var(--border);
            border-radius: var(--radius-sm);
            text-align: center;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
            background: #fafaf8;
            user-select: none;
        }
        .cat-option:hover { border-color: #ccc; }
        .cat-option.selected[data-cat="meat"] {
            border-color: var(--meat);
            background: var(--meat-bg);
            color: var(--meat);
        }
        .cat-option.selected[data-cat="veggie"] {
            border-color: var(--veggie);
            background: var(--veggie-bg);
            color: var(--veggie);
        }
        .cat-option.selected[data-cat="soup"] {
            border-color: var(--soup);
            background: var(--soup-bg);
            color: var(--soup);
        }
        .cat-option.selected[data-cat="staple"] {
            border-color: var(--staple);
            background: var(--staple-bg);
            color: var(--staple);
        }

        .emoji-picker {
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
            margin-top: 8px;
        }
        .emoji-opt {
            width: 36px;
            height: 36px;
            border-radius: 8px;
            border: 2px solid transparent;
            background: #f5f5f0;
            font-size: 18px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.15s;
            flex-shrink: 0;
        }
        .emoji-opt:hover { border-color: #ccc; transform: scale(1.1); }
        .emoji-opt.selected { border-color: #f39c12; background: #fff8e6; }

        .btn-row {
            display: flex;
            gap: 10px;
            margin-top: 24px;
        }
        .btn {
            flex: 1;
            padding: 14px;
            border-radius: 50px;
            font-size: 16px;
            font-weight: 700;
            cursor: pointer;
            border: none;
            transition: all 0.2s;
        }
        .btn-primary {
            background: linear-gradient(135deg, #e74c3c, #f39c12);
            color: #fff;
            box-shadow: 0 4px 16px rgba(231, 76, 60, 0.3);
        }
        .btn-primary:hover { box-shadow: 0 6px 24px rgba(231, 76, 60, 0.4); transform: translateY(-1px); }
        .btn-cancel {
            background: #f0f0ec;
            color: var(--text-secondary);
        }
        .btn-cancel:hover { background: #e8e8e2; }

        /* ===== Random Pick Overlay ===== */
        .pick-overlay {
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.5);
            z-index: 999;
            display: flex;
            align-items: center;
            justify-content: center;
            animation: fadeIn 0.2s;
        }
        .pick-card {
            background: #fff;
            border-radius: 24px;
            padding: 32px 28px 24px;
            text-align: center;
            max-width: 300px;
            width: 85%;
            animation: popIn 0.35s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            position: relative;
        }
        .pick-close {
            position: absolute;
            top: 12px;
            right: 14px;
            width: 28px;
            height: 28px;
            border-radius: 50%;
            border: none;
            background: #f0f0ec;
            color: #999;
            font-size: 14px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        @keyframes popIn {
            from { transform: scale(0.5); opacity: 0; }
            to { transform: scale(1); opacity: 1; }
        }
        .pick-title {
            font-size: 18px;
            font-weight: 700;
            color: #e74c3c;
            margin-bottom: 16px;
        }
        .pick-emoji {
            font-size: 64px;
            margin-bottom: 12px;
            animation: bounce 0.6s ease-in-out 0.2s both;
        }
        @keyframes bounce {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-16px); }
        }
        .pick-name {
            font-size: 22px;
            font-weight: 700;
            color: #2c3e50;
            margin-bottom: 6px;
        }
        .pick-cat {
            font-size: 14px;
            color: #999;
            margin-bottom: 20px;
        }
        .pick-actions {
            display: flex;
            gap: 8px;
            justify-content: center;
        }
        .pick-btn {
            border: none;
            border-radius: 50px;
            padding: 10px 16px;
            font-size: 14px;
            font-weight: 700;
            cursor: pointer;
            white-space: nowrap;
        }
        .pick-add {
            background: linear-gradient(135deg, #e74c3c, #f39c12);
            color: #fff;
        }
        .pick-again {
            background: #f0f0ec;
            color: #666;
        }

        /* ===== Toast ===== */
        .toast {
            position: fixed;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            background: #2c3e50;
            color: #fff;
            padding: 12px 24px;
            border-radius: 50px;
            font-size: 14px;
            font-weight: 600;
            z-index: 999;
            animation: toastIn 0.3s, toastOut 0.3s 1.7s forwards;
            pointer-events: none;
        }
        @keyframes toastIn { from { opacity: 0; transform: translateX(-50%) translateY(-20px); } to { opacity: 1; transform: translateX(-50%) translateY(0); } }
        @keyframes toastOut { from { opacity: 1; } to { opacity: 0; } }

        /* ===== Page System ===== */
        .page { display: none; }
        .page.active { display: block; }

        /* ===== Bottom Nav ===== */
        .bottom-nav {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            background: var(--card);
            display: flex;
            border-top: 1px solid var(--border);
            z-index: 200;
            padding-bottom: env(safe-area-inset-bottom);
            box-shadow: 0 -2px 12px rgba(0,0,0,0.05);
        }
        .nav-item {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 8px 0 6px;
            cursor: pointer;
            transition: color 0.2s;
            color: #aaa;
            position: relative;
        }
        .nav-item.active { color: #e74c3c; }
        .nav-icon { font-size: 22px; }
        .nav-label { font-size: 11px; font-weight: 600; margin-top: 2px; }
        .nav-badge {
            position: absolute;
            top: 4px;
            right: 50%;
            transform: translateX(140%);
            background: #e74c3c;
            color: #fff;
            font-size: 10px;
            font-weight: 700;
            min-width: 18px;
            height: 18px;
            border-radius: 9px;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 0 5px;
        }

        /* ===== Today Page ===== */
        .today-list {
            padding: 0 16px 100px;
        }
        .today-group {
            margin-bottom: 20px;
        }
        .today-group-title {
            font-size: 14px;
            font-weight: 700;
            color: var(--text-secondary);
            padding: 12px 4px 8px;
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .today-dish {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 12px 14px;
            background: var(--card);
            border-radius: var(--radius-sm);
            margin-bottom: 8px;
            box-shadow: var(--shadow);
        }
        .today-dish .td-emoji { font-size: 28px; flex-shrink: 0; }
        .today-dish .td-name { flex: 1; font-size: 16px; font-weight: 600; }
        .today-dish .td-remove {
            width: 28px; height: 28px;
            border-radius: 50%;
            border: none;
            background: #fee;
            color: #e74c3c;
            font-size: 14px;
            cursor: pointer;
            flex-shrink: 0;
        }
        .today-empty { padding-top: 80px; }
        .today-clear {
            display: block;
            margin: 20px auto 0;
            padding: 8px 20px;
            border-radius: 50px;
            border: 1px solid #ddd;
            background: #fff;
            color: #999;
            font-size: 13px;
            cursor: pointer;
        }

        /* ===== Responsive ===== */
        @media (max-width: 400px) {
            .header { padding: 20px 16px 18px; }
            .header h1 { font-size: 22px; }
            .header .subtitle { font-size: 12px; }
            .search-bar { margin: 8px 10px; padding: 8px 12px; }
            .search-bar input { font-size: 14px; }
            .list-container { padding: 0 10px; }
            .dish-card { padding: 12px 10px; gap: 8px; }
            .dish-emoji { font-size: 24px; width: 36px; height: 36px; }
            .dish-name { font-size: 15px; }
            .dish-want { padding: 4px 8px; font-size: 12px; }
            .fab { width: 48px; height: 48px; font-size: 24px; bottom: 80px; right: 20px; }
            .today-list { padding: 0 10px 100px; }
        }
    </style>
</head>
<body>

    <!-- ==================== 菜单浏览页 ==================== -->
    <div id="page-browse" class="page active">

    <!-- Header -->
    <div class="header">
        <h1>🏠 家庭菜单</h1>
        <div class="subtitle">今天想吃什么？</div>
    </div>

    <!-- Tabs -->
    <div class="tabs">
        <div class="tab active" data-cat="all" onclick="switchTab('all')">
            全部 <span class="count" id="countAll">0</span>
        </div>
        <div class="tab" data-cat="meat" onclick="switchTab('meat')">
            🥩 荤菜 <span class="count" id="countMeat">0</span>
        </div>
        <div class="tab" data-cat="veggie" onclick="switchTab('veggie')">
            🥬 素菜 <span class="count" id="countVeggie">0</span>
        </div>
        <div class="tab" data-cat="soup" onclick="switchTab('soup')">
            🍲 汤 <span class="count" id="countSoup">0</span>
        </div>
        <div class="tab" data-cat="staple" onclick="switchTab('staple')">
            🍚 主食 <span class="count" id="countStaple">0</span>
        </div>
    </div>

    <!-- Search -->
    <div class="search-bar" id="searchBar">
        <span class="search-icon">🔍</span>
        <input type="text" id="searchInput" placeholder="搜索菜品..." autocomplete="off" oninput="onSearch()">
        <button class="search-clear" id="searchClear" onclick="clearSearch()" style="display:none">✕</button>
        <button class="random-btn" onclick="randomPick()" title="随机选一道">🎲</button>
    </div>

    <!-- Dish List -->
    <div class="list-container">
        <div class="dish-list" id="dishList"></div>
        <div class="empty-state" id="emptyState">
            <div class="empty-icon">📋</div>
            <p>菜单还是空的呢～<br>点击右下角 <b>+</b> 来添加第一道菜吧！</p>
        </div>
    </div>

    <!-- FAB -->
    <button class="fab" onclick="openModal()" title="添加菜品">+</button>

    </div><!-- /page-browse -->

    <!-- ==================== 今日菜单页 ==================== -->
    <div id="page-today" class="page">
        <div class="header">
            <h1>📅 今日菜单</h1>
            <div class="subtitle" id="todaySubtitle">还没选菜呢</div>
        </div>

        <div class="today-list" id="todayList"></div>

        <div class="empty-state today-empty" id="todayEmpty">
            <div class="empty-icon">🛒</div>
            <p>今天还没选菜～<br>去「菜单」里点 ❤️ 加入今日菜单吧</p>
        </div>
    </div>

    <!-- Add/Edit Modal -->
    <div class="modal-overlay" id="modalOverlay" style="display:none" onclick="closeModalOutside(event)">
        <div class="modal" onclick="event.stopPropagation()">
            <h2 id="modalTitle">➕ 添加菜品</h2>

            <div class="form-group">
                <label>菜品名称 *</label>
                <input type="text" id="dishName" placeholder="例如：红烧排骨" maxlength="20" autocomplete="off">
            </div>

            <div class="form-group">
                <label>分类 *</label>
                <div class="cat-selector">
                    <div class="cat-option selected" data-cat="meat" onclick="selectCat('meat')">🥩 荤菜</div>
                    <div class="cat-option" data-cat="veggie" onclick="selectCat('veggie')">🥬 素菜</div>
                    <div class="cat-option" data-cat="soup" onclick="selectCat('soup')">🍲 汤</div>
                    <div class="cat-option" data-cat="staple" onclick="selectCat('staple')">🍚 主食</div>
                </div>
            </div>

            <div class="form-group">
                <label>图标</label>
                <div class="emoji-picker" id="emojiPicker"></div>
            </div>

            <div class="form-group">
                <label>备注（选填）</label>
                <textarea id="dishNote" placeholder="例如：少放辣、多放香菜…" maxlength="100"></textarea>
            </div>

            <div class="btn-row">
                <button class="btn btn-cancel" onclick="closeModal()">取消</button>
                <button class="btn btn-primary" onclick="saveDish()">保存</button>
            </div>
        </div>
    </div>

    <!-- Bottom Nav -->
    <nav class="bottom-nav">
        <div class="nav-item active" data-page="browse" onclick="switchPage('browse')">
            <span class="nav-icon">📋</span>
            <span class="nav-label">菜单</span>
        </div>
        <div class="nav-item" data-page="today" onclick="switchPage('today')">
            <span class="nav-icon">📅</span>
            <span class="nav-label">今日菜单</span>
            <span class="nav-badge" id="todayBadge" style="display:none">0</span>
        </div>
    </nav>

    <!-- Toast container -->
    <div id="toastContainer"></div>

    <script>
        // ===== 家庭菜单 - GitHub Pages + localStorage 混合架构 =====
        // data.json → 官方菜库（由管理员维护，推送到 GitHub 自动同步）
        // localStorage → 家人自己添加的菜 + 所有"想吃"标记

        const STORE_KEY = 'fm_dishes_v2';
        const WANT_KEY = 'fm_wants_v2';
        const TODAY_KEY = 'fm_today';
        const SYNC_KEY = 'fm_last_sync';

        const DEFAULT_EMOJIS = {
            meat: ['🥩','🍗','🍖','🥓','🦐','🐟','🐔','🦆','🐷','🐮','🦀','🦑','🍤','🥘','🍳'],
            veggie: ['🥬','🥒','🥦','🍅','🍆','🌶️','🧄','🧅','🥕','🌽','🍄','🫑','🥔','🫘','🥗'],
            soup: ['🍲','🥣','🫕','🍜','🥘','🍵','🫘'],
            staple: ['🍚','🍜','🍝','🥟','🍞','🥖','🍠','🌽','🥐','🫓','🍙','🍘']
        };

        let dishes = [];
        let wants = {};
        let todayMenu = [];
        let currentTab = 'all';
        let currentPage = 'browse';
        let searchQuery = '';
        let editingId = null;
        let selectedCat = 'meat';
        let selectedEmoji = '';

        // ===== Storage helpers =====
        function loadStore() {
            try {
                dishes = JSON.parse(localStorage.getItem(STORE_KEY)) || [];
                wants = JSON.parse(localStorage.getItem(WANT_KEY)) || {};
                todayMenu = JSON.parse(localStorage.getItem(TODAY_KEY)) || [];
            } catch { dishes = []; wants = {}; todayMenu = []; }
        }

        function saveStore() {
            localStorage.setItem(STORE_KEY, JSON.stringify(dishes));
            localStorage.setItem(WANT_KEY, JSON.stringify(wants));
        }

        function saveToday() {
            localStorage.setItem(TODAY_KEY, JSON.stringify(todayMenu));
        }

        // ===== Seed Data: 内嵌初始菜品，保证一定可见 =====
        const SEED_DISHES = [
          {"id":"d001","name":"广式萝卜牛腩煲","cat":"meat","emoji":"🥘","note":""},
          {"id":"d002","name":"豆豉鲮鱼炒油麦菜","cat":"meat","emoji":"🐟","note":""},
          {"id":"d003","name":"葱姜炒花甲","cat":"meat","emoji":"🦪","note":""},
          {"id":"d004","name":"黄焖鸡","cat":"meat","emoji":"🍗","note":""},
          {"id":"d005","name":"海南鸡饭","cat":"staple","emoji":"🐔","note":""},
          {"id":"d006","name":"汉堡肉盖饭","cat":"staple","emoji":"🍛","note":""},
          {"id":"d007","name":"三杯鸡","cat":"meat","emoji":"🍗","note":""},
          {"id":"d008","name":"土豆鸡块","cat":"meat","emoji":"🥔","note":""},
          {"id":"d009","name":"卤肉饭","cat":"staple","emoji":"🍖","note":""},
          {"id":"d010","name":"新疆烤包子","cat":"staple","emoji":"🥟","note":""},
          {"id":"d011","name":"辣椒炒鸡","cat":"meat","emoji":"🌶️","note":""},
          {"id":"d012","name":"筋头巴脑炖土豆","cat":"meat","emoji":"🥘","note":""},
          {"id":"d013","name":"白菜炖豆腐","cat":"veggie","emoji":"🥬","note":""},
          {"id":"d014","name":"韭菜炒鸡蛋","cat":"veggie","emoji":"🥚","note":""},
          {"id":"d015","name":"尖椒干豆腐","cat":"veggie","emoji":"🫑","note":""},
          {"id":"d016","name":"裙带菜牛肉汤","cat":"soup","emoji":"🥣","note":""},
          {"id":"d017","name":"番茄时蔬汤","cat":"soup","emoji":"🍅","note":""},
          {"id":"d018","name":"番茄清炖牛肉","cat":"soup","emoji":"🥘","note":""},
          {"id":"d019","name":"东南亚鸡饭","cat":"staple","emoji":"🐔","note":""},
          {"id":"d020","name":"炝锅面","cat":"staple","emoji":"🍜","note":""},
          {"id":"d021","name":"米饭","cat":"staple","emoji":"🍚","note":""},
          {"id":"d022","name":"杂粮粥","cat":"staple","emoji":"🥣","note":""},
          {"id":"d023","name":"白粥","cat":"staple","emoji":"🥣","note":""},
          {"id":"d024","name":"盐葱酱牛舌盖饭","cat":"staple","emoji":"🍛","note":""},
          {"id":"d025","name":"东北老式拌饭","cat":"staple","emoji":"🍚","note":""},
          {"id":"d026","name":"凉拌菠菜","cat":"veggie","emoji":"🥬","note":""},
          {"id":"d027","name":"炝拌白菜心","cat":"veggie","emoji":"🥬","note":""},
          {"id":"d028","name":"蒜蓉蒸排骨","cat":"meat","emoji":"🥩","note":""},
          {"id":"d029","name":"沙姜盐焗鸡","cat":"meat","emoji":"🍗","note":""},
          {"id":"d030","name":"香煎鲈鱼","cat":"meat","emoji":"🐟","note":""},
          {"id":"d031","name":"柠檬鸡中翅","cat":"meat","emoji":"🍗","note":""},
          {"id":"d032","name":"板栗焖鸡","cat":"meat","emoji":"🍗","note":""},
          {"id":"d033","name":"烤羊排","cat":"meat","emoji":"🥩","note":""},
          {"id":"d034","name":"猪头肉拌黄瓜","cat":"meat","emoji":"🥒","note":""},
          {"id":"d035","name":"沙姜焗鸡","cat":"meat","emoji":"🍗","note":""},
          {"id":"d036","name":"酸菜炖排骨","cat":"meat","emoji":"🥘","note":""},
          {"id":"d037","name":"油焖大虾","cat":"meat","emoji":"🦐","note":""},
          {"id":"d038","name":"大盘鸡","cat":"meat","emoji":"🍗","note":""},
          {"id":"d039","name":"胸口爆包菜","cat":"meat","emoji":"🥬","note":""},
          {"id":"d040","name":"酱油水烧黄鱼","cat":"meat","emoji":"🐟","note":""},
          {"id":"d041","name":"土鸡菌菇汤","cat":"soup","emoji":"🍲","note":""},
          {"id":"d042","name":"咸排骨煲苦瓜","cat":"soup","emoji":"🥘","note":""},
          {"id":"d043","name":"脊骨萝卜汤","cat":"soup","emoji":"🥘","note":""},
          {"id":"d044","name":"五花肉泡菜豆腐汤","cat":"soup","emoji":"🥘","note":""}
        ];

        function ensureSeedData() {
          // 首次使用：把内嵌菜品写入 localStorage
          if (!localStorage.getItem(STORE_KEY)) {
            dishes = SEED_DISHES.map(d => ({ ...d, fromServer: true, createdAt: Date.now() }));
            wants = {};
            saveStore();
            return true;
          }
          return false;
        }

        // ===== Sync: 从 data.json 拉取菜库，确保本地有全部服务器菜品 =====
        async function syncFromServer() {
            try {
                const res = await fetch('/data.json?t=' + Date.now(), { cache: 'no-cache' });
                if (!res.ok) return;
                const serverDishes = await res.json();
                if (!Array.isArray(serverDishes) || serverDishes.length === 0) return;

                let changed = false;

                // 确保所有服务器菜品都在本地，且信息是最新的
                serverDishes.forEach(sd => {
                    const existing = dishes.find(d => d.id === sd.id);
                    if (existing) {
                        // 更新已有菜品（分类可能被调整）
                        if (sd.cat && existing.cat !== sd.cat) { existing.cat = sd.cat; changed = true; }
                        if (sd.name && existing.name !== sd.name) { existing.name = sd.name; changed = true; }
                        if (sd.emoji !== undefined && existing.emoji !== sd.emoji) { existing.emoji = sd.emoji; changed = true; }
                        if (sd.note !== undefined && existing.note !== sd.note) { existing.note = sd.note; changed = true; }
                    } else {
                        dishes.push({
                            id: sd.id,
                            name: sd.name,
                            cat: sd.cat,
                            emoji: sd.emoji || '',
                            note: sd.note || '',
                            fromServer: true,
                            createdAt: sd.createdAt || Date.now(),
                        });
                        changed = true;
                    }
                });

                if (changed) {
                    saveStore();
                    console.log('🆕 菜单已从菜库同步更新');
                    showToast('🆕 菜单已更新！');
                }
            } catch (e) {
                console.log('📡 离线模式，使用本地数据');
            }
        }

        async function initData() {
            ensureSeedData();           // 内嵌种子数据，保证一定有菜
            loadStore();                 // 加载本地（含种子数据 + 用户自增）
            await syncFromServer();      // 拉取服务器新增菜品
            renderAll();
            // 更新今日菜单徽标
            if (todayMenu.length > 0) {
                const badge = document.getElementById('todayBadge');
                badge.style.display = 'flex';
                badge.textContent = todayMenu.length;
            }
        }

        // ===== Render =====
        function getFilteredDishes() {
            let result = currentTab === 'all' ? dishes : dishes.filter(d => d.cat === currentTab);
            if (searchQuery) {
                const q = searchQuery.toLowerCase();
                result = result.filter(d => d.name.toLowerCase().includes(q));
            }
            return result;
        }

        function renderAll() {
            renderTabs();
            renderList();
        }

        function renderTabs() {
            document.getElementById('countAll').textContent = dishes.length;
            document.getElementById('countMeat').textContent = dishes.filter(d => d.cat === 'meat').length;
            document.getElementById('countVeggie').textContent = dishes.filter(d => d.cat === 'veggie').length;
            document.getElementById('countSoup').textContent = dishes.filter(d => d.cat === 'soup').length;
            document.getElementById('countStaple').textContent = dishes.filter(d => d.cat === 'staple').length;

            document.querySelectorAll('.tab').forEach(t => {
                t.classList.toggle('active', t.dataset.cat === currentTab);
            });
        }

        function renderList() {
            const list = document.getElementById('dishList');
            const empty = document.getElementById('emptyState');
            const filtered = getFilteredDishes();

            if (filtered.length === 0) {
                list.innerHTML = '';
                empty.style.display = 'block';
                return;
            }
            empty.style.display = 'none';

            list.innerHTML = filtered.map(d => {
                const inToday = todayMenu.includes(d.id);
                const wantedClass = inToday ? 'wanted' : '';
                const tooltip = inToday ? '已加入今日菜单，点击取消' : '点击加入今日菜单';
                return `
                <div class="dish-card ${d.cat}">
                    <div class="dish-emoji">${d.emoji || defaultEmojiForCat(d.cat)}</div>
                    <div class="dish-info">
                        <div class="dish-name">${escHtml(d.name)}</div>
                        ${d.note ? `<div class="dish-note">${escHtml(d.note)}</div>` : ''}
                    </div>
                    <div class="dish-want ${wantedClass}" onclick="event.stopPropagation(); toggleToday('${d.id}')" title="${escHtml(tooltip)}">
                        ❤️ ${inToday ? '<span class="want-count">✓</span>' : ''}
                    </div>
                </div>`;
            }).join('');
        }

        function defaultEmojiForCat(cat) {
            return { meat: '🥩', veggie: '🥬', soup: '🍲', staple: '🍚' }[cat] || '🍽️';
        }

        function escHtml(s) {
            const d = document.createElement('div');
            d.textContent = s;
            return d.innerHTML;
        }

        // ===== Tab Switching =====
        function switchTab(cat) {
            currentTab = cat;
            clearSearch();
            renderTabs();
            renderList();
        }

        function onSearch() {
            const input = document.getElementById('searchInput');
            const btn = document.getElementById('searchClear');
            searchQuery = input.value.trim();
            btn.style.display = searchQuery ? 'block' : 'none';
            renderList();
        }

        function clearSearch() {
            searchQuery = '';
            const input = document.getElementById('searchInput');
            const btn = document.getElementById('searchClear');
            if (input) input.value = '';
            if (btn) btn.style.display = 'none';
        }

        function randomPick() {
            const filtered = getFilteredDishes();
            if (filtered.length === 0) {
                showToast('当前分类没有菜品');
                return;
            }
            const pick = filtered[Math.floor(Math.random() * filtered.length)];
            showPickResult(pick);
        }

        function showPickResult(dish) {
            const old = document.getElementById('pickOverlay');
            if (old) old.remove();

            const catLabel = { meat: '🥩 荤菜', veggie: '🥬 素菜', soup: '🍲 汤', staple: '🍚 主食' }[dish.cat] || '';
            const overlay = document.createElement('div');
            overlay.id = 'pickOverlay';
            overlay.className = 'pick-overlay';
            overlay.onclick = function(e) { if (e.target === overlay) overlay.remove(); };
            overlay.innerHTML = `
                <div class="pick-card">
                    <button class="pick-close" onclick="document.getElementById('pickOverlay').remove()">✕</button>
                    <div class="pick-title">🎲 今天吃这个！</div>
                    <div class="pick-emoji">${dish.emoji || '🍽️'}</div>
                    <div class="pick-name">${dish.name}</div>
                    <div class="pick-cat">${catLabel}</div>
                    <div class="pick-actions">
                        <button class="pick-btn pick-again" onclick="randomPick()">🎲 继续挑选</button>
                        <button class="pick-btn pick-add" onclick="pickAddToToday('${dish.id}')">✅ 加入菜单</button>
                    </div>
                </div>`;
            document.body.appendChild(overlay);
        }

        function pickAddToToday(dishId) {
            if (!todayMenu.includes(dishId)) {
                todayMenu.push(dishId);
                saveToday();
                renderList();
                renderTodayIfActive();
            }
            const overlay = document.getElementById('pickOverlay');
            if (overlay) overlay.remove();
            showToast('已加入今日菜单 ✅');
        }

        // ===== Today Menu: 红心加入/移除今日菜单 =====
        function toggleToday(dishId) {
            const idx = todayMenu.indexOf(dishId);
            if (idx >= 0) {
                todayMenu.splice(idx, 1);
            } else {
                todayMenu.push(dishId);
            }
            saveToday();
            renderList();
            renderTodayIfActive();
        }

        // ===== Page Switching =====
        function switchPage(page) {
            currentPage = page;
            document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
            document.getElementById('page-' + page).classList.add('active');
            document.querySelectorAll('.nav-item').forEach(n => n.classList.toggle('active', n.dataset.page === page));
            // 隐藏/显示 FAB
            document.querySelector('.fab').style.display = page === 'browse' ? 'flex' : 'none';
            if (page === 'today') renderToday();
        }

        function renderTodayIfActive() {
            if (currentPage === 'today') renderToday();
        }

        function renderToday() {
            const list = document.getElementById('todayList');
            const empty = document.getElementById('todayEmpty');
            const subtitle = document.getElementById('todaySubtitle');
            const badge = document.getElementById('todayBadge');

            // 更新导航徽标
            if (todayMenu.length > 0) {
                badge.style.display = 'flex';
                badge.textContent = todayMenu.length;
            } else {
                badge.style.display = 'none';
            }

            if (todayMenu.length === 0) {
                list.innerHTML = '';
                empty.style.display = 'block';
                subtitle.textContent = '还没选菜呢';
                return;
            }
            empty.style.display = 'none';
            subtitle.textContent = '共 ' + todayMenu.length + ' 道菜';

            // 分组
            const groups = { meat: [], veggie: [], soup: [], staple: [] };
            const labels = { meat: '🥩 荤菜', veggie: '🥬 素菜', soup: '🍲 汤', staple: '🍚 主食' };
            todayMenu.forEach(id => {
                const dish = dishes.find(d => d.id === id);
                if (dish && groups[dish.cat]) groups[dish.cat].push(dish);
            });

            list.innerHTML = Object.entries(groups).map(([cat, items]) => {
                if (items.length === 0) return '';
                return `<div class="today-group">
                    <div class="today-group-title">${labels[cat]} (${items.length})</div>
                    ${items.map(d => `
                        <div class="today-dish">
                            <span class="td-emoji">${d.emoji || defaultEmojiForCat(d.cat)}</span>
                            <span class="td-name">${escHtml(d.name)}</span>
                            <button class="td-remove" onclick="toggleToday('${d.id}')" title="移除">✕</button>
                        </div>
                    `).join('')}
                </div>`;
            }).join('');

            // 清空按钮
            list.insertAdjacentHTML('beforeend',
                '<button class="today-clear" onclick="clearToday()">🗑️ 清空今日菜单</button>');
        }

        function clearToday() {
            if (!confirm('确定清空今日菜单？')) return;
            todayMenu = [];
            saveToday();
            renderList();
            renderToday();
        }

        // ===== Delete =====
        function deleteDish(id) {
            const dish = dishes.find(d => d.id === id);
            if (!dish) return;
            if (!confirm(`确定删除「${dish.name}」吗？`)) return;
            dishes = dishes.filter(d => d.id !== id);
            delete wants[id];
            todayMenu = todayMenu.filter(tid => tid !== id);
            saveStore();
            saveToday();
            renderAll();
            showToast(`已删除「${dish.name}」`);
        }

        // ===== Modal =====
        function openModal(editId) {
            editingId = editId || null;
            selectedCat = 'meat';
            selectedEmoji = '';
            document.getElementById('dishName').value = '';
            document.getElementById('dishNote').value = '';

            if (editId) {
                const dish = dishes.find(d => d.id === editId);
                if (dish) {
                    document.getElementById('modalTitle').textContent = '✏️ 编辑菜品';
                    document.getElementById('dishName').value = dish.name;
                    document.getElementById('dishNote').value = dish.note || '';
                    selectedCat = dish.cat;
                    selectedEmoji = dish.emoji || '';
                }
            } else {
                document.getElementById('modalTitle').textContent = '➕ 添加菜品';
            }

            updateCatSelector();
            renderEmojiPicker();
            document.getElementById('modalOverlay').style.display = 'flex';
            setTimeout(() => document.getElementById('dishName').focus(), 300);
        }

        function closeModal() {
            document.getElementById('modalOverlay').style.display = 'none';
            editingId = null;
        }

        function closeModalOutside(e) {
            if (e.target === document.getElementById('modalOverlay')) closeModal();
        }

        function selectCat(cat) {
            selectedCat = cat;
            selectedEmoji = '';
            updateCatSelector();
            renderEmojiPicker();
        }

        function updateCatSelector() {
            document.querySelectorAll('.cat-option').forEach(opt => {
                opt.classList.toggle('selected', opt.dataset.cat === selectedCat);
            });
        }

        function renderEmojiPicker() {
            const picker = document.getElementById('emojiPicker');
            const emojis = DEFAULT_EMOJIS[selectedCat] || DEFAULT_EMOJIS.meat;
            picker.innerHTML = emojis.map(e => `
                <div class="emoji-opt${e === selectedEmoji ? ' selected' : ''}" onclick="selectEmoji('${e}')">${e}</div>
            `).join('');
        }

        function selectEmoji(emoji) {
            selectedEmoji = emoji;
            renderEmojiPicker();
        }

        function saveDish() {
            const name = document.getElementById('dishName').value.trim();
            if (!name) { showToast('请输入菜品名称'); document.getElementById('dishName').focus(); return; }
            const note = document.getElementById('dishNote').value.trim();

            if (editingId) {
                const dish = dishes.find(d => d.id === editingId);
                if (dish) {
                    dish.name = name;
                    dish.cat = selectedCat;
                    dish.emoji = selectedEmoji;
                    dish.note = note;
                }
            } else {
                dishes.push({
                    id: 'u' + Date.now() + '_' + Math.random().toString(36).slice(2, 6),
                    name,
                    cat: selectedCat,
                    emoji: selectedEmoji,
                    note,
                    fromServer: false,
                    createdAt: Date.now(),
                });
            }

            saveStore();
            closeModal();
            renderAll();
            showToast(editingId ? '已更新 ✨' : '已添加 🎉');
        }

        // ===== Toast =====
        function showToast(msg) {
            const container = document.getElementById('toastContainer');
            const toast = document.createElement('div');
            toast.className = 'toast';
            toast.textContent = msg;
            container.appendChild(toast);
            setTimeout(() => toast.remove(), 3000);
        }

        // ===== Keyboard =====
        document.addEventListener('keydown', e => {
            if (e.key === 'Escape') closeModal();
            if (e.key === 'Enter' && document.getElementById('modalOverlay').style.display === 'flex') {
                saveDish();
            }
        });

        // ===== PWA: Service Worker =====
        if ('serviceWorker' in navigator) {
            // 彻底清理所有旧 SW
            navigator.serviceWorker.getRegistrations().then(regs => {
                regs.forEach(r => r.unregister());
                // 清除所有 SW 缓存
                caches.keys().then(keys => {
                    keys.forEach(k => caches.delete(k));
                });
            }).finally(() => {
                navigator.serviceWorker.register('/sw.js?v=3').catch(() => {});
            });
        }

        // ===== Init =====
        initData().then(() => {
            console.log('✅ 菜单加载完成，共 ' + dishes.length + ' 道菜');
        });
        renderEmojiPicker();
    </script>
</body>
