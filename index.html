<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    <title>🏠 家庭菜单</title>

    <!-- PWA -->
    <link rel="manifest" href="/menu/manifest.json">
    <meta name="theme-color" content="#e74c3c">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="家庭菜单">
    <link rel="apple-touch-icon" href="/menu/icon.svg">
    <link rel="icon" href="/menu/icon.svg" type="image/svg+xml">
    <style>
        :root {
            --meat: #e74c3c;
            --meat-light: #fde8e5;
            --meat-bg: #fff5f5;
            --veggie: #27ae60;
            --veggie-light: #e6f7ee;
            --veggie-bg: #f5fdf8;
            --soup: #f39c12;
            --soup-light: #fef5e7;
            --soup-bg: #fffdf5;
            --staple: #e67e22;
            --staple-light: #fdf2e9;
            --staple-bg: #fffaf5;
            --drink: #3498db;
            --drink-light: #eaf4fd;
            --drink-bg: #f5fafe;
            --bg: #f8f6f2;
            --card: #ffffff;
            --text: #2c3e50;
            --text-secondary: #7f8c8d;
            --border: #e8e4dc;
            --shadow: 0 2px 12px rgba(0,0,0,0.06);
            --radius: 16px;
            --radius-sm: 10px;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
            background: var(--bg);
            color: var(--text);
            min-height: 100vh;
            padding-bottom: 100px;
        }

        /* ===== Header ===== */
        .header {
            background: linear-gradient(135deg, #e74c3c, #f39c12);
            color: #fff;
            padding: 28px 20px 24px;
            text-align: center;
            position: sticky;
            top: 0;
            z-index: 100;
            box-shadow: 0 4px 20px rgba(231, 76, 60, 0.25);
        }
        .header h1 {
            font-size: 28px;
            font-weight: 700;
            letter-spacing: 2px;
        }
        .header .subtitle {
            font-size: 13px;
            opacity: 0.85;
            margin-top: 4px;
        }

        /* ===== Category Tabs ===== */
        .tabs {
            display: flex;
            gap: 8px;
            padding: 16px 12px 4px;
            overflow-x: auto;
            -webkit-overflow-scrolling: touch;
            scrollbar-width: none;
        }
        .tabs::-webkit-scrollbar { display: none; }
        .tab {
            flex-shrink: 0;
            padding: 10px 14px;
            border: 2px solid var(--border);
            border-radius: 50px;
            background: var(--card);
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            text-align: center;
            transition: all 0.25s;
            white-space: nowrap;
            user-select: none;
            display: flex;
            align-items: center;
            gap: 2px;
        }
        .tab:hover { border-color: #ccc; }
        .tab.active {
            color: #fff;
            border-color: transparent;
        }
        .tab.active[data-cat="all"] { background: #555; }
        .tab.active[data-cat="meat"] { background: var(--meat); }
        .tab.active[data-cat="veggie"] { background: var(--veggie); }
        .tab.active[data-cat="soup"] { background: var(--soup); }
        .tab.active[data-cat="staple"] { background: var(--staple); }
        .tab.active[data-cat="drink"] { background: var(--drink); }
        .tab .count {
            display: inline-block;
            background: rgba(0,0,0,0.1);
            border-radius: 50px;
            padding: 2px 8px;
            font-size: 12px;
            margin-left: 4px;
        }
        .tab.active .count { background: rgba(255,255,255,0.25); }

        /* ===== Search Bar ===== */
        .search-bar {
            display: flex;
            align-items: center;
            gap: 8px;
            margin: 8px 16px;
            padding: 10px 14px;
            background: var(--card);
            border-radius: 50px;
            box-shadow: var(--shadow);
        }
        .search-icon {
            font-size: 16px;
            flex-shrink: 0;
            opacity: 0.5;
        }
        .search-bar input {
            flex: 1;
            border: none;
            outline: none;
            font-size: 15px;
            font-family: inherit;
            background: transparent;
            color: var(--text);
            min-width: 0;
        }
        .search-bar input::placeholder {
            color: #bbb;
        }
        .search-clear {
            flex-shrink: 0;
            width: 24px;
            height: 24px;
            border-radius: 50%;
            border: none;
            background: #e0e0dc;
            color: #999;
            font-size: 12px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .random-btn {
            flex-shrink: 0;
            width: 36px;
            height: 36px;
            border-radius: 50%;
            border: none;
            background: linear-gradient(135deg, #e74c3c, #f39c12);
            color: #fff;
            font-size: 18px;
            cursor: pointer;
            transition: transform 0.2s;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .random-btn:active { transform: scale(0.9); }

        /* ===== Dish List ===== */
        .list-container {
            padding: 0 16px;
        }
        .dish-list {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }
        .dish-card {
            background: var(--card);
            border-radius: var(--radius-sm);
            padding: 14px 12px;
            display: flex;
            align-items: center;
            gap: 10px;
            box-shadow: var(--shadow);
            transition: transform 0.15s, box-shadow 0.15s;
            cursor: pointer;
            border-left: 4px solid transparent;
        }
        .dish-card:hover {
            transform: translateY(-1px);
            box-shadow: 0 4px 20px rgba(0,0,0,0.1);
        }
        .dish-card.meat { border-left-color: var(--meat); }
        .dish-card.veggie { border-left-color: var(--veggie); }
        .dish-card.soup { border-left-color: var(--soup); }
        .dish-card.staple { border-left-color: var(--staple); }
        .dish-card.drink { border-left-color: var(--drink); }

        .dish-emoji {
            font-size: 28px;
            width: 40px;
            height: 40px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 10px;
            flex-shrink: 0;
        }
        .dish-card.meat .dish-emoji { background: var(--meat-light); }
        .dish-card.veggie .dish-emoji { background: var(--veggie-light); }
        .dish-card.soup .dish-emoji { background: var(--soup-light); }
        .dish-card.staple .dish-emoji { background: var(--staple-light); }
        .dish-card.drink .dish-emoji { background: var(--drink-light); }

        .dish-info { flex: 1; min-width: 0; }
        .dish-name {
            font-size: 16px;
            font-weight: 600;
            line-height: 1.4;
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .dish-name-text {
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }
        .tag {
            flex-shrink: 0;
            font-size: 10px;
            font-weight: 700;
            padding: 1px 6px;
            border-radius: 4px;
            line-height: 1.5;
        }
        .tag-seafood { background: #dbeafe; color: #2563eb; }
        .tag-spicy { background: #fee2e2; color: #dc2626; }
        .tag-cold { background: #ccfbf1; color: #0d9488; }
        .tag-bili { background: #ffe0ec; color: #e8387f; }
        .dish-note {
            font-size: 12px;
            color: var(--text-secondary);
            margin-top: 2px;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }
        .dish-ingredients {
            font-size: 12px;
            color: #8b9dc3;
            margin-top: 2px;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .dish-want {
            flex-shrink: 0;
            display: flex;
            align-items: center;
            gap: 3px;
            padding: 5px 10px;
            border-radius: 50px;
            font-size: 13px;
            font-weight: 600;
            transition: all 0.2s;
            border: 2px solid #eee;
            background: #fafafa;
            color: #999;
            user-select: none;
        }
        .dish-want:hover { border-color: #ff6b6b; color: #ff6b6b; }
        .dish-want.wanted {
            background: #ffe0e0;
            border-color: #ff6b6b;
            color: #e74c3c;
        }
        .dish-want .want-count {
            font-size: 11px;
            background: rgba(0,0,0,0.06);
            border-radius: 50px;
            padding: 1px 5px;
            min-width: 20px;
            text-align: center;
        }
        .dish-want.wanted .want-count {
            background: rgba(231,76,60,0.15);
        }

        /* ===== Empty State ===== */
        .empty-state {
            text-align: center;
            padding: 60px 20px;
            color: var(--text-secondary);
        }
        .empty-state .empty-icon { font-size: 64px; margin-bottom: 16px; }
        .empty-state p { font-size: 15px; line-height: 1.6; }


        /* ===== Modal ===== */
        .modal-overlay {
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.4);
            z-index: 300;
            display: flex;
            align-items: flex-end;
            justify-content: center;
            animation: fadeIn 0.2s;
        }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
        @keyframes slideUp { from { transform: translateY(100%); } to { transform: translateY(0); } }

        .modal {
            background: var(--card);
            border-radius: 20px 20px 0 0;
            width: 100%;
            max-width: 500px;
            max-height: 85vh;
            overflow-y: auto;
            padding: 24px 20px 40px;
            animation: slideUp 0.3s ease-out;
        }
        .modal h2 {
            font-size: 20px;
            margin-bottom: 20px;
            text-align: center;
        }
        .form-group {
            margin-bottom: 18px;
        }
        .form-group label {
            display: block;
            font-size: 14px;
            font-weight: 600;
            margin-bottom: 6px;
            color: var(--text);
        }
        .form-group input,
        .form-group textarea,
        .form-group select {
            width: 100%;
            padding: 12px 14px;
            border: 2px solid var(--border);
            border-radius: var(--radius-sm);
            font-size: 16px;
            font-family: inherit;
            background: #fafaf8;
            transition: border-color 0.2s;
            color: var(--text);
        }
        .form-group input:focus,
        .form-group textarea:focus,
        .form-group select:focus {
            outline: none;
            border-color: #f39c12;
            background: #fff;
        }
        .form-group textarea { resize: vertical; min-height: 60px; }

        .cat-selector {
            display: flex;
            gap: 10px;
        }
        .cat-option {
            flex: 1;
            padding: 12px;
            border: 2px solid var(--border);
            border-radius: var(--radius-sm);
            text-align: center;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
            background: #fafaf8;
            user-select: none;
        }
        .cat-option:hover { border-color: #ccc; }
        .cat-option.selected[data-cat="meat"] {
            border-color: var(--meat);
            background: var(--meat-bg);
            color: var(--meat);
        }
        .cat-option.selected[data-cat="veggie"] {
            border-color: var(--veggie);
            background: var(--veggie-bg);
            color: var(--veggie);
        }
        .cat-option.selected[data-cat="soup"] {
            border-color: var(--soup);
            background: var(--soup-bg);
            color: var(--soup);
        }
        .cat-option.selected[data-cat="staple"] {
            border-color: var(--staple);
            background: var(--staple-bg);
            color: var(--staple);
        }
        .cat-option.selected[data-cat="drink"] {
            border-color: var(--drink);
            background: var(--drink-bg);
            color: var(--drink);
        }

        .emoji-picker {
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
            margin-top: 8px;
        }
        .emoji-opt {
            width: 36px;
            height: 36px;
            border-radius: 8px;
            border: 2px solid transparent;
            background: #f5f5f0;
            font-size: 18px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.15s;
            flex-shrink: 0;
        }
        .emoji-opt:hover { border-color: #ccc; transform: scale(1.1); }
        .emoji-opt.selected { border-color: #f39c12; background: #fff8e6; }

        .btn-row {
            display: flex;
            gap: 10px;
            margin-top: 24px;
        }
        .btn {
            flex: 1;
            padding: 14px;
            border-radius: 50px;
            font-size: 16px;
            font-weight: 700;
            cursor: pointer;
            border: none;
            transition: all 0.2s;
        }
        .btn-primary {
            background: linear-gradient(135deg, #e74c3c, #f39c12);
            color: #fff;
            box-shadow: 0 4px 16px rgba(231, 76, 60, 0.3);
        }
        .btn-primary:hover { box-shadow: 0 6px 24px rgba(231, 76, 60, 0.4); transform: translateY(-1px); }
        .btn-cancel {
            background: #f0f0ec;
            color: var(--text-secondary);
        }
        .btn-cancel:hover { background: #e8e8e2; }

        /* ===== Random Pick Overlay ===== */
        .pick-overlay {
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.5);
            z-index: 999;
            display: flex;
            align-items: center;
            justify-content: center;
            animation: fadeIn 0.2s;
        }
        .pick-card {
            background: #fff;
            border-radius: 24px;
            padding: 32px 28px 24px;
            text-align: center;
            max-width: 300px;
            width: 85%;
            animation: popIn 0.35s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            position: relative;
        }
        .pick-close {
            position: absolute;
            top: 12px;
            right: 14px;
            width: 28px;
            height: 28px;
            border-radius: 50%;
            border: none;
            background: #f0f0ec;
            color: #999;
            font-size: 14px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        @keyframes popIn {
            from { transform: scale(0.5); opacity: 0; }
            to { transform: scale(1); opacity: 1; }
        }
        .pick-title {
            font-size: 18px;
            font-weight: 700;
            color: #e74c3c;
            margin-bottom: 16px;
        }
        .pick-emoji {
            font-size: 64px;
            margin-bottom: 12px;
            animation: bounce 0.6s ease-in-out 0.2s both;
        }
        @keyframes bounce {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-16px); }
        }
        .pick-name {
            font-size: 22px;
            font-weight: 700;
            color: #2c3e50;
            margin-bottom: 6px;
        }
        .pick-cat {
            font-size: 14px;
            color: #999;
            margin-bottom: 8px;
        }
        .pick-ingredients {
            font-size: 13px;
            color: #8b9dc3;
            margin-bottom: 16px;
        }
        /* ===== View Modal ===== */
        .view-overlay {
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.4);
            z-index: 300;
            display: flex;
            align-items: flex-end;
            justify-content: center;
            animation: fadeIn 0.2s;
        }
        .view-modal {
            background: var(--card);
            border-radius: 20px 20px 0 0;
            width: 100%;
            max-width: 500px;
            max-height: 85vh;
            overflow-y: auto;
            padding: 24px 20px 40px;
            animation: slideUp 0.3s ease-out;
            text-align: center;
        }
        .view-close {
            position: absolute;
            top: 16px;
            right: 20px;
            width: 32px;
            height: 32px;
            border-radius: 50%;
            border: none;
            background: #f0f0ec;
            color: #999;
            font-size: 16px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .view-emoji {
            font-size: 56px;
            margin: 8px 0 12px;
        }
        .view-name {
            font-size: 24px;
            font-weight: 700;
            color: var(--text);
            margin-bottom: 8px;
        }
        .view-tags {
            display: flex;
            gap: 6px;
            justify-content: center;
            flex-wrap: wrap;
            margin-bottom: 14px;
        }
        .view-cat {
            display: inline-block;
            padding: 6px 16px;
            border-radius: 50px;
            font-size: 14px;
            font-weight: 600;
            margin-bottom: 16px;
        }
        .view-cat.meat { background: var(--meat-light); color: var(--meat); }
        .view-cat.veggie { background: var(--veggie-light); color: var(--veggie); }
        .view-cat.soup { background: var(--soup-light); color: var(--soup); }
        .view-cat.staple { background: var(--staple-light); color: var(--staple); }
        .view-cat.drink { background: var(--drink-light); color: var(--drink); }
        .view-note {
            background: #fafaf8;
            border-radius: var(--radius-sm);
            padding: 14px 16px;
            font-size: 15px;
            color: var(--text-secondary);
            line-height: 1.6;
            margin-bottom: 20px;
            text-align: left;
        }
        .view-note-label {
            font-size: 12px;
            font-weight: 700;
            color: #bbb;
            margin-bottom: 4px;
            text-align: left;
        }
        .view-actions {
            display: flex;
            gap: 10px;
        }
        .view-btn {
            flex: 1;
            padding: 14px;
            border-radius: 50px;
            font-size: 16px;
            font-weight: 700;
            cursor: pointer;
            border: none;
            transition: all 0.2s;
        }
        .view-btn-close {
            background: #f0f0ec;
            color: var(--text-secondary);
        }
        .view-btn-close:hover { background: #e8e8e2; }

        .pick-actions {
            display: flex;
            gap: 8px;
            justify-content: center;
        }
        .pick-btn {
            border: none;
            border-radius: 50px;
            padding: 10px 16px;
            font-size: 14px;
            font-weight: 700;
            cursor: pointer;
            white-space: nowrap;
        }
        .pick-add {
            background: linear-gradient(135deg, #e74c3c, #f39c12);
            color: #fff;
        }
        .pick-again {
            background: #f0f0ec;
            color: #666;
        }

        /* ===== Toast ===== */
        .toast {
            position: fixed;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            background: #2c3e50;
            color: #fff;
            padding: 12px 24px;
            border-radius: 50px;
            font-size: 14px;
            font-weight: 600;
            z-index: 999;
            animation: toastIn 0.3s, toastOut 0.3s 1.7s forwards;
            pointer-events: none;
        }
        @keyframes toastIn { from { opacity: 0; transform: translateX(-50%) translateY(-20px); } to { opacity: 1; transform: translateX(-50%) translateY(0); } }
        @keyframes toastOut { from { opacity: 1; } to { opacity: 0; } }

        /* ===== Page System ===== */
        .page { display: none; }
        .page.active { display: block; }

        /* ===== Bottom Nav ===== */
        .bottom-nav {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            background: var(--card);
            display: flex;
            border-top: 1px solid var(--border);
            z-index: 200;
            padding-bottom: env(safe-area-inset-bottom);
            box-shadow: 0 -2px 12px rgba(0,0,0,0.05);
        }
        .nav-item {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 8px 0 6px;
            cursor: pointer;
            transition: color 0.2s;
            color: #aaa;
            position: relative;
        }
        .nav-item.active { color: #e74c3c; }
        .nav-icon { font-size: 22px; }
        .nav-label { font-size: 11px; font-weight: 600; margin-top: 2px; }
        .nav-badge {
            position: absolute;
            top: 4px;
            right: 50%;
            transform: translateX(140%);
            background: #e74c3c;
            color: #fff;
            font-size: 10px;
            font-weight: 700;
            min-width: 18px;
            height: 18px;
            border-radius: 9px;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 0 5px;
        }

        /* ===== Today Page ===== */
        .today-list {
            padding: 0 16px 100px;
        }
        .today-group {
            margin-bottom: 20px;
        }
        .today-group-title {
            font-size: 14px;
            font-weight: 700;
            color: var(--text-secondary);
            padding: 12px 4px 8px;
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .today-dish {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 12px 14px;
            background: var(--card);
            border-radius: var(--radius-sm);
            margin-bottom: 8px;
            box-shadow: var(--shadow);
        }
        .today-dish .td-emoji { font-size: 28px; flex-shrink: 0; }
        .today-dish .td-name { flex: 1; font-size: 16px; font-weight: 600; }
        .today-dish .td-remove {
            width: 28px; height: 28px;
            border-radius: 50%;
            border: none;
            background: #fee;
            color: #e74c3c;
            font-size: 14px;
            cursor: pointer;
            flex-shrink: 0;
        }
        .today-empty { padding-top: 80px; }
        .today-clear {
            display: block;
            margin: 20px auto 0;
            padding: 8px 20px;
            border-radius: 50px;
            border: 1px solid #ddd;
            background: #fff;
            color: #999;
            font-size: 13px;
            cursor: pointer;

        const APP_VERSION = '96';  // 每次更新菜品后改这个数字，APP自动刷新数据

        // 版本检测：新版本清除菜品缓存强制重新同步（不碰Token和今日菜单）
        (function checkVersion() {
            const stored = localStorage.getItem(VERSION_KEY);
            if (stored !== APP_VERSION) {
                // 只清除菜品相关数据，保留 Token、今日菜单
                localStorage.removeItem(STORE_KEY);
                localStorage.removeItem(WANT_KEY);
                localStorage.setItem(VERSION_KEY, APP_VERSION);
            }
        })();

        const DEFAULT_EMOJIS = {
            meat: ['🥩','🍗','🍖','🥓','🦐','🐟','🐔','🦆','🐷','🐮','🦀','🦑','🍤','🥘','🍳'],

            drink: ['🥤','🧃','🧋','☕','🍵','🫖','🥛','🍺','🍷','🍹','🍸','🧉']

        let wants = {};
        let todayMenu = [];

        let currentPage = 'browse';

        let editingId = null;

        // ===== Storage helpers =====
        function saveStore() {
            localStorage.setItem(STORE_KEY, JSON.stringify(dishes));
            localStorage.setItem(WANT_KEY, JSON.stringify(wants));
        }

        function saveToday() {
            localStorage.setItem(TODAY_KEY, JSON.stringify(todayMenu));
            localStorage.setItem(TODAY_DATE_KEY, todayDateStr());
        }

        // ===== 今日菜单云端同步（仓库 today.json，全设备共享）=====
        // 任何设备加菜/删菜 → 推送操作到 today.json；其他设备轮询拉取最新内容
        let todayEtag = '';       // 轮询用 ETag（304 不计入 API 限流）
        let todayPushCount = 0;   // 进行中的推送数（推送期间暂停应用远端数据，防止本地修改被回滚）
        let todaySetTried = false; // 云端过期时已尝试过一次自动建立今日菜单
        let noTokenHinted = false; // 未配置Token提示只弹一次

        function hintNoTokenOnce() {
            if (noTokenHinted) return;
            noTokenHinted = true;
            showToast('📵 未配置同步Token，今日菜单仅本机可见');
        }

        function todayDateStr() {
            const n = new Date();
            return n.getFullYear() + '-' + (n.getMonth() + 1) + '-' + n.getDate();
        }

        function todayApiHeaders() {
            return {
                Authorization: 'Bearer ' + ghToken,
                Accept: 'application/vnd.github+json',
                'X-GitHub-Api-Version': '2022-11-28'
            };
        }

        // 拉取远端今日菜单；返回 null 表示无变化或失败。日期不是今天则视为空
        async function fetchTodayRemote() {
            const today = todayDateStr();
            try {
                if (ghToken) {
                    const headers = todayApiHeaders();
                    if (todayEtag) headers['If-None-Match'] = todayEtag;
                    const res = await fetch(`https://api.github.com/repos/${GH_REPO}/contents/today.json`, { headers });
                    if (res.status === 304) return null;
                    if (!res.ok) return null;
                    const etag = res.headers.get('ETag');
                    if (etag) todayEtag = etag;
                    const file = await res.json();
                    const data = JSON.parse(base64Decode(file.content));
                    return { dishes: data.date === today ? (data.dishes || []) : [], stale: data.date !== today };
                }
                // 无 Token：走 CDN 回退
                const res = await fetchWithCdnFallback('today.json', 6000);
                if (!res || !res.ok) return null;
                const data = await res.json();
                return { dishes: data.date === today ? (data.dishes || []) : [], stale: data.date !== today };
            } catch { return null; }
        }

        // 应用远端数据到本地（推送进行中跳过，避免覆盖刚做的修改）
        function applyTodayRemote(remote, silent) {
            if (!remote || todayPushCount > 0) return;
            if (remote.stale) {
                // 云端还是旧日期：绝不用它清空本地；本地有今天新选的菜且有Token → 上传建立今日菜单
                if (todayMenu.length > 0 && ghToken && !todaySetTried) {
                    todaySetTried = true;
                    pushTodayOp({ type: 'set' });
                }
                return;
            }
            todaySetTried = false; // 云端已是今日数据，重置标记（供第二天再次自动建立）
            if (JSON.stringify(remote.dishes) === JSON.stringify(todayMenu)) return;
            todayMenu = remote.dishes;
            saveToday();
            renderList();
            renderTodayIfActive();
            if (!silent) showToast('🔄 今日菜单已同步更新');
        }

        // 推送一个操作到云端：add / remove / clear / set。冲突(409)时基于最新服务端状态重放操作，最多3次
        async function pushTodayOp(op) {
            if (!ghToken) { hintNoTokenOnce(); return; }
            todayPushCount++;
            let failMsg = '';
            try {
                const url = `https://api.github.com/repos/${GH_REPO}/contents/today.json`;
                for (let attempt = 0; attempt < 3; attempt++) {
                    const res = await fetch(url, { headers: todayApiHeaders() });
                    if (!res.ok) {
                        failMsg = res.status === 401 ? 'Token无效或已过期' :
                                  res.status === 403 ? 'Token权限不足' : 'HTTP ' + res.status;
                        break;
                    }
                    const file = await res.json();
                    const data = JSON.parse(base64Decode(file.content));
                    let list = data.date === todayDateStr() ? (data.dishes || []) : [];
                    if (op.type === 'set') {
                        // 建立今日菜单：云端已是今日则取并集，避免覆盖别人刚加的
                        list = data.date === todayDateStr() ? [...new Set([...list, ...todayMenu])] : [...todayMenu];
                    } else if (op.type === 'add') {
                        if (!list.includes(op.id)) list.push(op.id);
                    } else if (op.type === 'remove') {
                        list = list.filter(id => id !== op.id);
                    } else if (op.type === 'clear') {
                        list = [];
                    }
                    const newContent = JSON.stringify({ date: todayDateStr(), dishes: list }) + '\n';
                    const putRes = await fetch(url, {
                        method: 'PUT',
                        headers: { ...todayApiHeaders(), 'Content-Type': 'application/json' },
                        body: JSON.stringify({
                            message: '今日菜单：' + (op.type === 'add' ? '加菜' : op.type === 'remove' ? '删菜' : op.type === 'clear' ? '清空' : '同步'),
                            content: base64Encode(newContent),
                            sha: file.sha
                        })
                    });
                    if (putRes.ok) {
                        todayEtag = ''; // 内容已变，强制下次轮询拉全量
                        return;
                    }
                    if (putRes.status !== 409) {
                        failMsg = putRes.status === 403 ? 'Token权限不足（需Contents读写权限）' :
                                  putRes.status === 404 ? '仓库不可访问，请检查Token授权' : 'HTTP ' + putRes.status;
                        break;
                    }
                }
                showToast('⚠️ 今日菜单同步失败：' + (failMsg || '多人同时操作冲突，请重试'));
            } catch {
                showToast('⚠️ 今日菜单同步失败：网络错误');
            }
            finally { todayPushCount--; }
        }

        // 轮询：有 Token 10 秒一次（ETag 304 不计限流），无 Token 30 秒走 raw
        let todayPollTimer = null;
        function startTodayPolling() {
            if (todayPollTimer) clearInterval(todayPollTimer);
            todayPollTimer = setInterval(async () => {
                if (document.hidden) return;
                applyTodayRemote(await fetchTodayRemote());
            }, ghToken ? 10000 : 30000);

        // ===== 通用 CDN 回退请求（带超时）=====
        async function fetchWithCdnFallback(filename, timeoutMs) {
            const urls = [
                './' + filename,  // 同源(GitHub Pages)最快最稳：手机能打开页面就能拉到最新数据
                'https://cdn.jsdelivr.net/gh/' + GH_REPO + '@master/' + filename,
                'https://fastly.jsdelivr.net/gh/' + GH_REPO + '@master/' + filename,
                'https://raw.githubusercontent.com/' + GH_REPO + '/master/' + filename,
            ];
            for (const url of urls) {
                try {
                    const res = await fetch(url, { cache: 'no-cache', signal: AbortSignal.timeout(timeoutMs) });
                    if (res.ok) return res;
                } catch (e) { /* 下一个 */ }
            }
            return null;
        }

        // ===== Sync: 从 data.json 拉取菜库，确保本地有全部服务器菜品 =====
        // ===== 同步失败自动重试（GitHub 访问不稳定时反复尝试直到成功）=====
        let syncing = false;
        let syncRetryTimer = null;
        let syncRetryDelay = 30000;  // 首次重试间隔 30 秒，随后退避

        function scheduleSyncRetry() {
            if (syncRetryTimer) return;  // 已有重试排队
            syncRetryTimer = setTimeout(() => {
                syncRetryTimer = null;
                syncFromServer(false);   // 静默重试
            }, syncRetryDelay);
            syncRetryDelay = Math.min(syncRetryDelay * 2, 300000);  // 30s→1m→2m→4m→5m(上限)
        }

        function resetSyncRetry() {
            if (syncRetryTimer) { clearTimeout(syncRetryTimer); syncRetryTimer = null; }
            syncRetryDelay = 30000;
        }

        async function syncFromServer(showMsg) {
            if (syncing) return;
            syncing = true;
            try {
                const res = await fetchWithCdnFallback('data.json', 8000);
                if (!res || !res.ok) {
                    scheduleSyncRetry();  // 访问 GitHub 失败，稍后自动重试
                    return;
                }
                const serverDishes = await res.json();
                resetSyncRetry();  // 拉取成功，重试计时归零
                if (!Array.isArray(serverDishes) || serverDishes.length === 0) return;

                let changed = false;
                let newCount = 0;

                serverDishes.forEach(sd => {
                    let existing = dishes.find(d => d.id === sd.id);
                    if (!existing) {
                        // 检查是否有同名本地菜品（用户刚同步的），若有则合并而非重复
                        existing = dishes.find(d => d.name === sd.name && d.fromServer === false && !d.id.startsWith('d'));
                        if (existing) {
                            existing.id = sd.id;
                            existing.fromServer = true;
                            changed = true;
                        }
                    }
                    if (existing && existing.id === sd.id) {
                        if (sd.cat && existing.cat !== sd.cat) { existing.cat = sd.cat; changed = true; }
                        if (sd.name && existing.name !== sd.name) { existing.name = sd.name; changed = true; }
                        if (sd.emoji !== undefined && existing.emoji !== sd.emoji) { existing.emoji = sd.emoji; changed = true; }
                        if (sd.note !== undefined && existing.note !== sd.note) { existing.note = sd.note; changed = true; }
                        if (sd.ingredients !== undefined && existing.ingredients !== sd.ingredients) { existing.ingredients = sd.ingredients; changed = true; }
                        if (sd.tags !== undefined) { existing.tags = sd.tags; changed = true; }
                    } else {
                        dishes.push({
                            id: sd.id, name: sd.name, cat: sd.cat,
                            emoji: sd.emoji || '', note: sd.note || '',
                            ingredients: sd.ingredients || '',
                            tags: sd.tags || [],
                            fromServer: true,
                            createdAt: sd.createdAt || (new Date('2026-06-01').getTime() + parseInt(sd.id.replace('d','')) * 60000),
                        });
                        changed = true;
                        newCount++;
                    }
                });

                // 去重：同名同ID只保留一份
                const seen = new Set();
                dishes = dishes.filter(d => {
                    const key = d.id;
                    if (seen.has(key)) return false;
                    seen.add(key);
                    return true;
                });

                // 清理服务端已删除的菜品（ID以d开头但不在服务器数据中的）
                const serverIds = new Set(serverDishes.map(sd => sd.id));
                const beforeClean = dishes.length;
                dishes = dishes.filter(d => {
                    if (d.id && d.id.startsWith('d') && !serverIds.has(d.id)) {
                        console.log('🧹 清理已删除菜品:', d.id, d.name);
                        changed = true;
                        return false;
                    }
                    return true;
                });
                if (dishes.length < beforeClean) {
                    console.log('🧹 清理了 ' + (beforeClean - dishes.length) + ' 道已删除菜品');
                }

                if (changed) {
                    saveStore();
                    renderAll();
                    if (showMsg !== false) {
                        showToast(newCount > 0 ? '🆕 发现 ' + newCount + ' 道新菜！' : '🔄 菜单已同步');
                    }
                } else if (showMsg) {
                    showToast('✅ 已是最新');
                }
            } catch (e) {
                console.log('📡 离线模式，使用本地数据');
                if (showMsg) showToast('📡 网络不可用');
                scheduleSyncRetry();
            } finally {
                syncing = false;
            }
        }

        async function forceSync() {
            const btn = document.getElementById('syncBtn');
            btn.textContent = '⏳';
            await syncFromServer(true);
            btn.textContent = '🔄';

        async function initData() {
            // 加载本地数据（优先），种子数据作为兜底
            const stored = localStorage.getItem(STORE_KEY);
            let storedDishes = null;
            try { storedDishes = JSON.parse(stored); } catch {}
            if (storedDishes && Array.isArray(storedDishes) && storedDishes.length > 0) {
                dishes = storedDishes;
            } else {
                // 无本地数据时用内嵌种子数据
                const baseTime = Date.now();
                dishes = SEED_DISHES.map((d, i) => ({
                    ...d,
                    fromServer: true,
                    createdAt: baseTime - (SEED_DISHES.length - i) * 1000
                }));
            }

            // 加载 wants 和 todayMenu
            try {
                wants = JSON.parse(localStorage.getItem(WANT_KEY)) || {};
                todayMenu = JSON.parse(localStorage.getItem(TODAY_KEY)) || [];
                if (localStorage.getItem(TODAY_DATE_KEY) !== todayDateStr()) todayMenu = [];
            } catch { wants = {}; todayMenu = []; }

            // 去重
            const deduped = [];
            const seen = new Set();
            dishes.forEach(d => {
                if (seen.has(d.id)) return;
                seen.add(d.id);
                deduped.push(d);
            });
            dishes = deduped;
            saveStore();

            // 立即渲染（不依赖任何网络请求）
            renderAll();
            updateBadge();

            // 后台静默同步服务器数据（仅在有变化时重新渲染，避免闪烁）
            const countBefore = dishes.length;
            syncFromServer().catch(() => {}).then(() => {
                if (dishes.length !== countBefore) {
                    renderAll();
                }
                updateBadge();
            });

            // 后台拉取今日菜单
            fetchTodayRemote().then(remote => {
                applyTodayRemote(remote, true);
                updateBadge();
            }).catch(() => {});

            startTodayPolling();
        }

        function updateBadge() {
            const badge = document.getElementById('todayBadge');
            if (todayMenu.length > 0) {
                badge.style.display = 'flex';
                badge.textContent = todayMenu.length;
            } else {
                badge.style.display = 'none';
            }
        }

        // ===== Render =====
        function getFilteredDishes() {
            let result = currentTab === 'all' ? dishes.slice() : dishes.filter(d => d.cat === currentTab);
            if (searchQuery) {
                let q = searchQuery.toLowerCase();
                // 同义词扩展：番茄↔西红柿互相匹配
                const terms = [q];
                if (q.includes('番茄')) terms.push(q.replace(/番茄/g, '西红柿'));
                if (q.includes('西红柿')) terms.push(q.replace(/西红柿/g, '番茄'));
                // 同义词扩展：圆白菜↔卷心菜↔包菜互相匹配
                if (q.includes('圆白菜')) { terms.push(q.replace(/圆白菜/g, '卷心菜')); terms.push(q.replace(/圆白菜/g, '包菜')); }
                if (q.includes('卷心菜')) { terms.push(q.replace(/卷心菜/g, '圆白菜')); terms.push(q.replace(/卷心菜/g, '包菜')); }
                if (q.includes('包菜')) { terms.push(q.replace(/包菜/g, '圆白菜')); terms.push(q.replace(/包菜/g, '卷心菜')); }
                // 同义词扩展：泡菜↔辣白菜互相匹配
                if (q.includes('泡菜')) terms.push(q.replace(/泡菜/g, '辣白菜'));
                if (q.includes('辣白菜')) terms.push(q.replace(/辣白菜/g, '泡菜'));
                result = result.filter(d => {
                    const haystack = (d.name + '|' + (d.ingredients || '')).toLowerCase();
                    return terms.some(t => haystack.includes(t));
                });
            }
            // 排序规则：按ID降序。d开头取数字，u开头取时间戳
            result.sort((a, b) => {
                const getVal = (id) => {
                    if (id.startsWith('d')) return parseInt(id.slice(1));
                    if (id.startsWith('u')) return parseInt(id.slice(1).split('_')[0]) / 1000;
                    return 0;
                };
                return getVal(b.id) - getVal(a.id);
            });
            return result;
        }

        function renderList() {
            const list = document.getElementById('dishList');
            const empty = document.getElementById('emptyState');
            const filtered = getFilteredDishes();

            if (filtered.length === 0) {
                list.innerHTML = '';

            list.innerHTML = filtered.map(d => {

                <div class="dish-card ${d.cat}" data-id="${d.id}" onclick="viewDish('${d.id}')" title="点击查看 | 长按删除">

                                const cls = { '海鲜': 'seafood', '辣': 'spicy', '凉菜': 'cold', 'B站': 'bili', 'bilibili': 'bili' }[t] || '';

                            }).join('')}
                            ${localBadge}
                        </div>
                        ${d.ingredients ? `<div class="dish-ingredients">📋 ${escHtml(d.ingredients)}</div>` : ''}
                        ${d.note ? `<div class="dish-note">${escHtml(d.note)}</div>` : ''}

            if (!todayMenu.includes(dishId)) {
                todayMenu.push(dishId);
                pushTodayOp({ type: 'add', id: dishId });
                saveToday();
                renderList();
                renderTodayIfActive();
            }
            const overlay = document.getElementById('pickOverlay');
            if (overlay) overlay.remove();
            showToast('已加入今日菜单 ✅');

        // ===== Today Menu: 红心加入/移除今日菜单 =====
        function toggleToday(dishId) {
            const idx = todayMenu.indexOf(dishId);
            if (idx >= 0) {
                todayMenu.splice(idx, 1);
                pushTodayOp({ type: 'remove', id: dishId });
            } else {
                todayMenu.push(dishId);
                pushTodayOp({ type: 'add', id: dishId });
            }
            saveToday();
            renderList();
            renderTodayIfActive();
        }

            // 分组
            const groups = { meat: [], veggie: [], soup: [], staple: [] };
            const labels = { meat: '🥩 荤菜', veggie: '🥬 素菜', soup: '🍲 汤', staple: '🍚 主食' };
            todayMenu.forEach(id => {
                const dish = dishes.find(d => d.id === id);
                if (dish && groups[dish.cat]) groups[dish.cat].push(dish);
            });

            list.innerHTML = Object.entries(groups).map(([cat, items]) => {
                if (items.length === 0) return '';
                return `<div class="today-group">
                    <div class="today-group-title">${labels[cat]} (${items.length})</div>
                    ${items.map(d => `
                        <div class="today-dish">
                            <span class="td-emoji">${d.emoji || defaultEmojiForCat(d.cat)}</span>
                            <span class="td-name">${escHtml(d.name)}</span>
                            <button class="td-remove" onclick="toggleToday('${d.id}')" title="移除">✕</button>
                        </div>
                    `).join('')}
                </div>`;
            }).join('');

            // 清空按钮
            list.insertAdjacentHTML('beforeend',
                '<button class="today-clear" onclick="clearToday()">🗑️ 清空今日菜单</button>');
        }

        function clearToday() {
            if (!confirm('确定清空今日菜单？')) return;
            todayMenu = [];
            pushTodayOp({ type: 'clear' });
            saveToday();
            renderList();
            renderToday();
        }

        // ===== Delete =====
        function deleteDish(id) {
            const dish = dishes.find(d => d.id === id);
            if (!dish) return;
            if (!confirm(`确定删除「${dish.name}」吗？\n\n本地删除：刷新后恢复\n服务器删除：永久删除，所有人同步`)) return;
            const fromServer = dish.fromServer;
            // 本地删除
            dishes = dishes.filter(d => d.id !== id);
            delete wants[id];
            if (todayMenu.includes(id)) pushTodayOp({ type: 'remove', id });
            todayMenu = todayMenu.filter(tid => tid !== id);
            saveStore();
            saveToday();
            renderAll();
            // 服务器删除
            if (fromServer && ghToken) {
                syncDeleteFromGitHub(id, dish.name);
            }
            showToast(`已删除「${dish.name}」` + (fromServer && ghToken ? '（含服务器）' : ''));
        }

        async function syncDeleteFromGitHub(id, name) {
            try {
                const apiHeaders = {
                    Authorization: 'Bearer ' + ghToken,
                    Accept: 'application/vnd.github+json',
                    'X-GitHub-Api-Version': '2022-11-28'
                };
                const url = `https://api.github.com/repos/${GH_REPO}/contents/data.json`;
                const res = await fetch(url, { headers: apiHeaders });
                if (!res.ok) return;
                const file = await res.json();
                const content = JSON.parse(base64Decode(file.content));
                const idx = content.findIndex(d => d.id === id);
                if (idx < 0) return;
                content.splice(idx, 1);
                const newContent = JSON.stringify(content, null, 2) + '\n';
                await fetch(url, {
                    method: 'PUT',
                    headers: { ...apiHeaders, 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        message: `删除菜品：${name}`,
                        content: base64Encode(newContent),
                        sha: file.sha
                    })
                });
            } catch (e) { /* 静默 */ }
        }

        // ===== View Modal =====
        function viewDish(dishId) {
            const dish = dishes.find(d => d.id === dishId);
            if (!dish) return;

            document.getElementById('viewEmoji').textContent = dish.emoji || defaultEmojiForCat(dish.cat);
            document.getElementById('viewName').textContent = dish.name;

            // Tags
            const tagsContainer = document.getElementById('viewTags');
            if (dish.tags && dish.tags.length > 0) {
                tagsContainer.innerHTML = dish.tags.map(t => {
                    const cls = { '海鲜': 'seafood', '辣': 'spicy', '凉菜': 'cold', 'B站': 'bili', 'bilibili': 'bili' }[t] || '';
                    return `<span class="tag tag-${cls}">${t}</span>`;
                }).join('');
                tagsContainer.style.display = 'flex';
            } else {
                tagsContainer.style.display = 'none';
            }

            // Category
            const catLabels = { meat: '🥩 荤菜', veggie: '🥬 素菜', soup: '🍲 汤', staple: '🍚 主食', drink: '🥤 饮品' };
            const catEl = document.getElementById('viewCat');
            catEl.textContent = catLabels[dish.cat] || '';
            catEl.className = 'view-cat ' + dish.cat;

            // Ingredients
            const ingSection = document.getElementById('viewIngredientsSection');
            if (dish.ingredients) {
                document.getElementById('viewIngredients').textContent = dish.ingredients;
                ingSection.style.display = 'block';
            } else {
                ingSection.style.display = 'none';
            }

            // Note
            const noteSection = document.getElementById('viewNoteSection');
            if (dish.note) {
                document.getElementById('viewNote').textContent = dish.note;
                noteSection.style.display = 'block';
            } else {
                noteSection.style.display = 'none';
            }

            document.getElementById('viewOverlay').style.display = 'flex';
        }

        function closeView() {
            document.getElementById('viewOverlay').style.display = 'none';
        }

        function closeViewOutside(e) {
            if (e.target === document.getElementById('viewOverlay')) closeView();
        }

        // ===== Modal =====
        function openModal(editId) {
            editingId = editId || null;
            selectedCat = 'meat';
            selectedEmoji = '';
            document.getElementById('dishName').value = '';
            document.getElementById('dishNote').value = '';

            if (editId) {
                const dish = dishes.find(d => d.id === editId);
                if (dish) {
                    document.getElementById('modalTitle').textContent = '✏️ 编辑菜品';
                    document.getElementById('dishName').value = dish.name;
                    document.getElementById('dishNote').value = dish.note || '';
                    selectedCat = dish.cat;
                    selectedEmoji = dish.emoji || '';
                }
            } else {
                document.getElementById('modalTitle').textContent = '➕ 添加菜品';
            }

            updateCatSelector();
            renderEmojiPicker();
            document.getElementById('modalOverlay').style.display = 'flex';
            setTimeout(() => document.getElementById('dishName').focus(), 300);
        }

        function closeModal() {
            document.getElementById('modalOverlay').style.display = 'none';
            editingId = null;
        }

        function closeModalOutside(e) {
            if (e.target === document.getElementById('modalOverlay')) closeModal();
        }

        function selectCat(cat) {
            selectedCat = cat;
            selectedEmoji = '';
            updateCatSelector();
            renderEmojiPicker();
        }

        function updateCatSelector() {
            document.querySelectorAll('.cat-option').forEach(opt => {
                opt.classList.toggle('selected', opt.dataset.cat === selectedCat);
            });
        }

        function renderEmojiPicker() {
            const picker = document.getElementById('emojiPicker');
            const emojis = DEFAULT_EMOJIS[selectedCat] || DEFAULT_EMOJIS.meat;
            picker.innerHTML = emojis.map(e => `
                <div class="emoji-opt${e === selectedEmoji ? ' selected' : ''}" onclick="selectEmoji('${e}')">${e}</div>
            `).join('');
        }

        function selectEmoji(emoji) {
            selectedEmoji = emoji;
            renderEmojiPicker();
        }

        // ===== 自动打标签：根据菜名关键词匹配 =====
        function autoTag(name) {
            const tags = [];
            // 海鲜
            if (/虾|鱼|蟹|贝|蚝|蚬|鲍|鲈|黄鱼|花甲|鱿|鳗|鲳|蛏|扇贝|海蛎|蛤|螺|蛎|蝤|蚶|蛑|鲅|鲨|鲮|鲻|鲐|鲣|鲥|鲦|鲧|鳊|鳁|鳇|鲉|鲓|鲕|鲖|鲗|鲙|鲝|鲞|鲟|鲠|鲡|鲢|鲣|鲤|鲦|鲩|鲪|鲬|鲭|鲮|鲯|鲱|鲳|鲷|鲸|鲺|鲻|鲼|鲽|鲾|鲿|鳀|鳂|鳃|鳈|鳉|鳊|鳋|鳌|鳍|鳎|鳏|鳐|鳑|鳒|鳓|鳔|鳕|鳘|鳙|鳛|鳜|鳝|鳟|鳠|鳣|鳤|龙利|多宝|石斑|带鱼|鱿鱼|墨鱼|章鱼|海参|海胆|海蜇|紫菜|海带|裙带|蛤蜊|蛏子|生蚝|牡蛎|青口|淡菜|象拔蚌|北极贝|三文|金枪|鳕鱼/i.test(name)) {
                tags.push('海鲜');
            }
            // 辣
            if (/辣|麻辣|香辣|辣椒|剁椒|泡椒|红油|水煮|酸辣/i.test(name)) {
                tags.push('辣');
            }
            // 凉菜
            if (/凉拌|拌|沙拉|老虎菜|蒜泥|卤|酱香肘|皮冻/i.test(name)) {
                tags.push('凉菜');
            }
            return tags;
        }

        function saveDish() {
            const name = document.getElementById('dishName').value.trim();
            if (!name) { showToast('请输入菜品名称'); document.getElementById('dishName').focus(); return; }
            const note = document.getElementById('dishNote').value.trim();

            // 重名检测
            const dup = dishes.find(d => d.name === name && d.id !== editingId);
            if (dup) {
                showToast('「' + name + '」已存在，无需重复添加');
                return;
            }

            if (editingId) {
                const dish = dishes.find(d => d.id === editingId);
                if (dish) {
                    dish.name = name;
                    dish.cat = selectedCat;
                    dish.emoji = selectedEmoji;
                    dish.note = note;
                    dish.tags = autoTag(name);
                }
            } else {
                dishes.push({
                    id: 'u' + Date.now() + '_' + Math.random().toString(36).slice(2, 6),
                    name,
                    cat: selectedCat,
                    emoji: selectedEmoji,
                    note,
                    tags: autoTag(name),
                    fromServer: false,
                    createdAt: Date.now(),
                });
            }

            saveStore();
            closeModal();
            renderAll();

            // 自动同步到 GitHub
            if (!editingId && ghToken) {
                syncNewDishToGitHub(name, selectedCat, selectedEmoji, note);
            } else if (!editingId && !ghToken) {
                showToast('已添加 🎉（仅本机）');
            } else if (editingId && ghToken) {
                syncEditToGitHub(editingId);
            } else {
                showToast(editingId ? '已更新 ✨' : '已添加 🎉');
            }
        }

        // ===== GitHub 自动同步 =====
        function base64Encode(str) {
            const bytes = new TextEncoder().encode(str);
            const binString = Array.from(bytes, b => String.fromCharCode(b)).join('');
            return btoa(binString);
        }
        function base64Decode(b64) {
            const binString = atob(b64);
            const bytes = Uint8Array.from(binString, c => c.charCodeAt(0));
            return new TextDecoder().decode(bytes);
        }

        async function syncNewDishToGitHub(name, cat, emoji, note) {
            showToast('☁️ 正在同步到服务器...');
            try {
                const apiHeaders = {
                    Authorization: 'Bearer ' + ghToken,
                    Accept: 'application/vnd.github+json',
                    'X-GitHub-Api-Version': '2022-11-28'
                };

                // 1. 拉取当前 data.json
                const url = `https://api.github.com/repos/${GH_REPO}/contents/data.json`;
                const res = await fetch(url, { headers: apiHeaders });
                if (!res.ok) {
                    const err = await res.json().catch(() => ({}));
                    throw new Error(err.message || 'HTTP ' + res.status);
                }
                const file = await res.json();
                const content = JSON.parse(base64Decode(file.content));
                const sha = file.sha;

                // 2. 生成新 ID
                const maxId = content.reduce((max, d) => {
                    const n = parseInt(d.id.replace('d', ''));
                    return n > max ? n : max;
                }, 0);
                const newId = 'd' + String(maxId + 1).padStart(3, '0');

                // 3. 追加新菜品
                const newDish = {
                    id: newId, name, cat, emoji: emoji || '', note: note || '',
                    ingredients: '', tags: autoTag(name)
                };
                content.push(newDish);

                // 4. 提交到 GitHub
                const newContent = JSON.stringify(content, null, 2) + '\n';
                const putRes = await fetch(url, {
                    method: 'PUT',
                    headers: { ...apiHeaders, 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        message: `新增菜品：${name}`,
                        content: base64Encode(newContent),
                        sha: sha
                    })
                });
                if (!putRes.ok) {
                    const err = await putRes.json().catch(() => ({}));
                    throw new Error(err.message || 'HTTP ' + putRes.status);
                }

                // 5. 更新本地：ID 改为服务端 ID，标记已同步
                const localDish = dishes.find(d => d.name === name && d.fromServer === false && !d.id.startsWith('d'));
                if (localDish) {
                    localDish.id = newId;
                    localDish.fromServer = true;
                    saveStore();
                    renderAll();
                }
                showToast('✅ 已同步上线，家人可见！');
            } catch (e) {
                console.error('同步失败:', e);
                showToast('⚠️ ' + (e.message || '同步失败，仅保存在本机'));
            }
        }

        async function syncEditToGitHub(editId) {
            const dish = dishes.find(d => d.id === editId);
            if (!dish) return;
            showToast('☁️ 正在同步到服务器...');
            try {
                const apiHeaders = {
                    Authorization: 'Bearer ' + ghToken,
                    Accept: 'application/vnd.github+json',
                    'X-GitHub-Api-Version': '2022-11-28'
                };

                const url = `https://api.github.com/repos/${GH_REPO}/contents/data.json`;
                const res = await fetch(url, { headers: apiHeaders });
                if (!res.ok) {
                    const err = await res.json().catch(() => ({}));
                    throw new Error(err.message || 'HTTP ' + res.status);
                }
                const file = await res.json();
                const content = JSON.parse(base64Decode(file.content));
                const sha = file.sha;

                // 更新对应菜品
                const idx = content.findIndex(d => d.id === editId);
                if (idx >= 0) {
                    content[idx].name = dish.name;
                    content[idx].cat = dish.cat;
                    content[idx].emoji = dish.emoji;
                    content[idx].note = dish.note || '';
                    content[idx].ingredients = dish.ingredients || '';
                    content[idx].tags = dish.tags || [];
                } else {
                    content.push({
                        id: editId, name: dish.name, cat: dish.cat,
                        emoji: dish.emoji || '', note: dish.note || '',
                        ingredients: dish.ingredients || '', tags: dish.tags || []
                    });
                }

                const newContent = JSON.stringify(content, null, 2) + '\n';
                const putRes = await fetch(url, {
                    method: 'PUT',
                    headers: { ...apiHeaders, 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        message: `编辑菜品：${dish.name}`,
                        content: base64Encode(newContent),
                        sha: sha
                    })
                });
                if (!putRes.ok) {
                    const err = await putRes.json().catch(() => ({}));
                    throw new Error(err.message || 'HTTP ' + putRes.status);
                }

                if (!dish.fromServer) {
                    dish.fromServer = true;
                    saveStore();
                    renderAll();
                }
                showToast('✅ 已同步上线！');
            } catch (e) {
                console.error('同步失败:', e);
                showToast('⚠️ ' + (e.message || '同步失败，仅保存在本机'));
            }
        }

        // ===== 管理员设置 Token（长按标题 3 秒） =====
        async function setToken(token) {
            if (!token) {
                localStorage.removeItem(GH_TOKEN_KEY);
                ghToken = '';
                showToast('🔒 自动同步已关闭');
                startTodayPolling();  // 降级为 30 秒慢轮询
                return;
            }
            // 验证 Token 是否有效
            showToast('🔍 正在验证 Token...');
            try {
                const testRes = await fetch(`https://api.github.com/repos/${GH_REPO}`, {
                    headers: {
                        Authorization: 'Bearer ' + token,
                        Accept: 'application/vnd.github+json',
                        'X-GitHub-Api-Version': '2022-11-28'
                    }
                });
                if (!testRes.ok) {
                    const msg = testRes.status === 401 ? 'Token 无效或已过期' :
                                testRes.status === 403 ? 'Token 没有访问此仓库的权限' :
                                testRes.status === 404 ? '仓库不存在或 Token 未授权此仓库' :
                                '验证失败 HTTP ' + testRes.status;
                    showToast('❌ ' + msg);
                    return;
                }
                localStorage.setItem(GH_TOKEN_KEY, token);
                ghToken = token;
                showToast('✅ Token 有效，自动同步已开启');
                updateSyncStatus();
                applyTodayRemote(await fetchTodayRemote(), true);  // 立即拉一次今日菜单
                startTodayPolling();  // 切换为 10 秒快轮询
            } catch (e) {
                showToast('❌ 网络错误，请稍后重试');
            }
        }

        let headerTapTimer = null;
        function promptToken() {
            const token = prompt('🔑 输入 GitHub Personal Access Token\n（Fine-grained token → 选 j-kai-moji/menu → Contents 读写权限）\n\n留空则关闭自动同步', ghToken);
            if (token !== null) setToken(token.trim());
        }
        document.querySelector('.header').addEventListener('mousedown', () => {
            headerTapTimer = setTimeout(promptToken, 3000);
        });
        document.querySelector('.header').addEventListener('mouseup', () => clearTimeout(headerTapTimer));
        document.querySelector('.header').addEventListener('mouseleave', () => clearTimeout(headerTapTimer));
        document.querySelector('.header').addEventListener('touchstart', () => {
            headerTapTimer = setTimeout(promptToken, 3000);
        }, { passive: true });
        document.querySelector('.header').addEventListener('touchend', () => clearTimeout(headerTapTimer));
        document.querySelector('.header').addEventListener('touchcancel', () => clearTimeout(headerTapTimer));

        // ===== Toast =====
        function showToast(msg) {
            const container = document.getElementById('toastContainer');
            const toast = document.createElement('div');
            toast.className = 'toast';
            toast.textContent = msg;
            container.appendChild(toast);
            setTimeout(() => toast.remove(), 3000);
        }

        // ===== Keyboard =====
        document.addEventListener('keydown', e => {
            if (e.key === 'Escape') { closeModal(); closeView(); }
            if (e.key === 'Enter' && document.getElementById('modalOverlay').style.display === 'flex') {
                saveDish();
            }
        });

        // ===== PWA: Service Worker =====
        if ('serviceWorker' in navigator) {
            // 正常注册：SW 自带 skipWaiting + claim，更新版本的 sw.js 会自动替代旧版
            navigator.serviceWorker.register('/menu/sw.js?v=' + APP_VERSION).catch(() => {});
        }

        // ===== 长按删除菜品 =====
        (function initLongPress() {
            const list = document.getElementById('dishList');
            let timer = null, targetCard = null;
            list.addEventListener('touchstart', (e) => {
                targetCard = e.target.closest('.dish-card');
                if (!targetCard) return;
                timer = setTimeout(() => {
                    const id = targetCard.dataset.id;
                    if (id) deleteDish(id);
                    timer = null;
                }, 800);
            }, { passive: true });
            list.addEventListener('touchend', () => { clearTimeout(timer); });
            list.addEventListener('touchmove', () => { clearTimeout(timer); });
            list.addEventListener('mousedown', (e) => {
                targetCard = e.target.closest('.dish-card');
                if (!targetCard) return;
                timer = setTimeout(() => {
                    const id = targetCard.dataset.id;
                    if (id) deleteDish(id);
                    timer = null;
                }, 800);
            });
            list.addEventListener('mouseup', () => { clearTimeout(timer); });
            list.addEventListener('mouseleave', () => { clearTimeout(timer); });
        })();

        // ===== Init =====
        initData().then(() => {
            console.log('✅ 菜单加载完成，共 ' + dishes.length + ' 道菜');
            updateSyncStatus();
        });
        renderEmojiPicker();

        function updateSyncStatus() {
            const sub = document.getElementById('headerSubtitle');
            const localCount = dishes.filter(d => !d.fromServer).length;
            const ver = ' · v' + APP_VERSION;
            if (!ghToken) {
                sub.textContent = localCount > 0 ? `今天想吃什么？（${localCount}道本地菜未同步）${ver}` : '今天想吃什么？' + ver;
                sub.style.color = localCount > 0 ? '#ffe0a0' : '';
            } else {
                sub.textContent = localCount > 0 ? `☁️ ${localCount}道待同步，编辑后自动推送${ver}` : '☁️ 自动同步已开启' + ver;
                sub.style.color = '';
            }
        }
    </script>
